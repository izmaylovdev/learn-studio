# Ukrainian wording for library/symbols.yml. Only `name`, `say`, `def` and `eg`
# are read from here; everything the matcher uses (tex, match, sel, where, kind)
# stays in the source lexicon, so a translation cannot change what lights up.

integral:
  name: Знак інтеграла
  say: "«інтеграл від»"
  def: >-
    Видовжене S — від слова «сума». Він каже, що все праворуч нарізано на шари й
    додано, у границі, коли шари стають нескінченно тонкими.
  eg: >-
    Це не вказівка шукати первісну — так його лише зазвичай обчислюють.

sigma-sum:
  name: Знак суми
  say: "«сума»"
  def: >-
    Велика грецька сигма — від «сума». Додайте одну копію того, що стоїть далі,
    для кожного значення індексу між нижньою та верхньою межами.
  eg: "∑ від i=1 до n додає n доданків. ∫ — це те, чим вона стає в границі."

limit:
  name: Границя
  say: "«границя при»"
  def: >-
    Значення, до якого наближаються, але не обов’язково досягають. Усе, чим аналіз
    відрізняється від алгебри, сховано в цьому слові.
  eg: "lim при n→∞ означає: беріть n дедалі більшим і дивіться, на чому відповідь усталюється."

radical:
  name: Квадратний корінь
  say: "«корінь квадратний з»"
  def: Невід’ємне число, квадрат якого дорівнює тому, що стоїть під рискою.
  eg: >-
    Під інтегралом це зазвичай погана новина — саме √(1+f′²) робить більшість
    інтегралів довжини дуги необчислюваними в замкненому вигляді.

factorial:
  name: Факторіал
  say: "«факторіал»"
  def: "n! = n × (n−1) × … × 2 × 1. Росте швидше за будь-яку експоненту."
  eg: >-
    У ряді Тейлора він скорочує n!, що з’являється при диференціюванні xⁿ; в
    оцінці похибки саме він робить додавання нових членів вигідним.

prime:
  name: Штрих похідної
  say: "«штрих»"
  def: Одна похідна на кожен штрих. f′ — швидкість зміни f.
  eg: "f⁽ⁿ⁾ з числом у дужках — та сама ідея, коли штрихів стає забагато."

equals:
  name: Дорівнює
  say: "«дорівнює»"
  def: >-
    Твердження, що обидві частини — той самий об’єкт. Варто на ньому зупинитися:
    в означенні воно вводить позначення, у теоремі — це те, що доводять.
  eg: >-
    Знак рівності в означенні ∫ — це означення; той, що в основній теоремі, треба
    було заслужити.

infinity:
  name: Нескінченність
  say: "«нескінченність»"
  def: >-
    Не число, а напрямок. Вона з’являється лише під знаком границі, і саме це
    надає їй змісту.
  eg: >-
    Інтеграл до ∞ — скорочення для границі, тому невласні інтеграли й потребують
    її.

bound-a:
  name: Нижня межа
  say: "«а»"
  def: >-
    Звідки починається накопичення. У ряді Тейлора та сама літера — центр, точка,
    від якої все відраховують.
  eg: "Поміняйте a і b місцями — і інтеграл змінить знак. Орієнтація є частиною означення."

bound-b:
  name: Верхня межа
  say: "«бе»"
  def: Де накопичення зупиняється.
  eg: "∫ від a до b, потім F(b) − F(a): верхню межу підставляють першою."

alpha-bound:
  name: Початковий кут
  say: "«альфа»"
  def: Кут, з якого починається обертання.
  eg: >-
    Вибрати α і β так, щоб область було пройдено рівно один раз, — уся складність
    задачі на площу в полярних координатах.

beta-bound:
  name: Кінцевий кут
  say: "«бета»"
  def: Кут, на якому обертання зупиняється.
  eg: "Звичка брати від 0 до 2π — саме так області рахують двічі."

half:
  name: Одна друга
  say: "«одна друга»"
  def: >-
    Не підгінний множник. Сектор кута dθ — це частка dθ/2π повного круга площі
    πr², і 2π скорочується до ½.
  eg: "Її поява — ознака того, що ви додаєте сектори, а не прямокутники."

c-mean:
  name: Невідома внутрішня точка
  say: "«це»"
  def: >-
    Якась точка між центром і x. Теорема гарантує, що вона існує, але ніколи не
    каже де, — тому формулу й використовують як оцінку.
  eg: >-
    Замініть f⁽ᴺ⁺¹⁾(c) її максимумом на проміжку — і рівність стає придатною до
    вжитку нерівністю.

f-fn:
  name: Функція
  say: "«еф»"
  def: >-
    Те, що інтегрують, диференціюють або наближають. Подайте їй число — отримаєте
    число.
  eg: "У ∫f(x)dx функція f задає висоту кожного шару."

F-antideriv:
  name: Первісна
  say: "«велике еф»"
  def: >-
    Будь-яка функція, похідна якої дорівнює f. Велика літера — це домовленість,
    що позначає цей зв’язок.
  eg: >-
    «Будь-яка» — точно: первісні відрізняються на сталу, і ця стала скорочується
    в F(b) − F(a).

r-fn:
  name: Функція радіуса
  say: "«ер»"
  def: >-
    Відстань від початку координат при даному куті. У полярних координатах r —
    функція від θ, а не незалежна змінна.
  eg: "Там, де r = 0, одна петля кривої замикається й відкривається наступна."

remainder:
  name: Залишок
  say: "«ер з індексом ен»"
  def: >-
    Рівно те, у чому помилився обірваний многочлен, — f мінус її власний
    многочлен Тейлора. Не оцінка, а тотожність.
  eg: "Ряд дорівнює функції саме тоді, коли R_N → 0."

x-var:
  name: Змінна
  say: "«ікс»"
  def: >-
    Те, що змінюється. У визначеному інтегралі це німа змінна: інтегрування її
    поглинає, і у відповіді її немає.
  eg: "∫f(x)dx і ∫f(t)dt — те саме число. Перейменування німої змінної нічого не змінює."

n-index:
  name: Кількість частин
  say: "«ен»"
  def: Скільки шарів, доданків чи кроків. Завжди натуральне число, завжди прямує до ∞.
  eg: "Подвоєння n вдвічі зменшує Δx. Вони завжди рухаються разом."

i-index:
  name: Лічильник
  say: "«і»"
  def: >-
    На якому ви доданку. Він існує лише між межами ∑ і невидимий поза нею.
  eg: "Нижній індекс i — лічильник, а не степінь."

sample-point:
  name: Точка вибору
  say: "«ікс і із зірочкою»"
  def: >-
    Де всередині шару i вимірюють висоту. Зірочка позначає, що вибір за вами —
    лівий край, правий край, середина, будь-де.
  eg: >-
    Для неперервної f будь-який вибір дає ту саму границю, тому означення може
    сказати «візьміть будь-яку».

theta-var:
  name: Кут
  say: "«тета»"
  def: Напрямок від початку координат, що відраховується проти годинникової стрілки від додатної півосі x.
  eg: "У полярних координатах θ — параметр, який ви пробігаєте, а r — те, що відгукується."

dx:
  name: Диференціал
  say: "«де ікс»"
  def: >-
    Ширина одного нескінченно тонкого шару і позначка, яка змінна пробігається. Він
    закриває ∫, як дужка закриває групу.
  eg: >-
    f(x)·dx — це висота × ширина, площа одного шару. Замініть на dθ — і ви
    пробігаєте зовсім іншу вісь.

delta-x:
  name: Ширина шару
  say: "«дельта ікс»"
  def: "Ширина одного шару, поки вона ще скінченна: (b − a)/n."
  eg: "Δx — це те, чим є dx до переходу до границі. Та сама величина на іншій стадії."

d-theta:
  name: Елемент кута
  say: "«де тета»"
  def: Нескінченно малий клин кута, що його замітає один полярний шар.
  eg: "Іде в парі з ½r², бо шар — це круговий сектор, а не прямокутник."

u-fn:
  name: u — частина, яку диференціюють
  say: "«у»"
  def: >-
    Функція від x, яку ви обираєте. Не змінна, що позначає число, — u є цілим
    шматком підінтегрального виразу, обраним тому, що його диференціювання
    спрощує справу.
  eg: >-
    Вибір u — уся майстерність інтегрування частинами. Решта механічна.

v-fn:
  name: v — частина, для якої шукають первісну
  say: "«ве»"
  def: >-
    Інша функція від x, отримана як первісна dv. Її треба вміти знайти — це
    жорстке обмеження на те, як розбивати підінтегральний вираз.
  eg: >-
    Годиться будь-яка первісна — стала скорочується у фінальній відповіді, тож
    беріть найпростішу.

du:
  name: Диференціал u
  say: "«де у»"
  def: >-
    u′(x)·dx — що один нескінченно малий крок по x робить з u. Щоб його отримати,
    треба диференціювати, а це завжди можливо.
  eg: >-
    Ця асиметрія — увесь фокус: du коштує похідну, v коштує інтеграл, тож незручний
    множник кладіть в u.

dv:
  name: Диференціал v
  say: "«де ве»"
  def: >-
    v′(x)·dx — шматок підінтегрального виразу, для якого ви зобов’язуєтеся знайти
    первісну; він несе в собі dx.
  eg: >-
    Усе, що лишилося після вибору u, — це dv, включно з dx. Забути dx — найчастіший
    спосіб заплутатися.

minus:
  name: Знак мінус
  say: "«мінус»"
  def: >-
    Віднімання. Між двома доданками він забирає другий від першого.
  eg: >-
    Тут це не факультативна бухгалтерія — саме знак робить тотожність оберненням
    правила добутку, а не його повторенням.

g-fn:
  name: g — внутрішня функція
  say: "«же від ікс»"
  def: >-
    Функція всередині композиції. У заміні змінної саме її перейменовують на u, і
    її похідна вже має бути в підінтегральному виразі.
  eg: >-
    Помітити g — уся майстерність: показник степеня, підкореневий вираз, аргумент
    логарифма чи тригонометричної функції — ось де ховається внутрішня функція.

sin-fn:
  name: Синус
  say: "«синус»"
  def: >-
    Функція кута. Для інтегрування важить її похідна: (sin x)′ = cos x, тож
    зайвий cos x може правити за du.
  eg: >-
    Кожен прийом тригонометричного інтегрування будується навколо того, який
    множник можна відщепити на роль du.

cos-fn:
  name: Косинус
  say: "«косинус»"
  def: >-
    Друга половина пари. (cos x)′ = −sin x, тож зайвий sin x — це du з точністю
    до знака.
  eg: >-
    Що відщеплювати — синус чи косинус, — вирішує те, у кого непарний степінь.

m-exp:
  name: Показник синуса
  say: "«ем»"
  def: >-
    Скільки множників-синусів. m ніколи не обчислюють — лише перевіряють, парне
    воно чи непарне, бо від цього залежить метод.
  eg: >-
    Питання в парності, а не у величині. m = 3 і m = 4 розв’язуються
    непов’язаними методами.

k-exp:
  name: Показник пар косинусів
  say: "«ка»"
  def: >-
    Скільки *пар* косинусів лишається після того, як один відщепили на роль du.
    Тотожність може перетворити пари; одиночний множник — ні.
  eg: >-
    Запис степеня косинуса як 2k+1 робить непарний випадок наочним — один множник
    іде, а парна кількість лишається для перетворення.

a-param:
  name: Стала під коренем
  say: "«а»"
  def: >-
    Фіксоване число, а не межа інтегрування. Воно задає масштаб підстановки й
    переходить у відповідь.
  eg: >-
    a — це те, що робить підкореневий вираз схожим на одну з трьох форм: для
    √(4−x²) це 2, бо 4 = 2².

a-root:
  name: Корінь знаменника
  say: "«а»"
  def: >-
    Значення, при якому один множник перетворюється на нуль. Розклад має рівно
    один доданок на корінь, тому спершу треба розкласти знаменник повністю.
  eg: >-
    Підставляння кореня вбиває всі доданки, крім його власного, — це швидкий
    спосіб знайти сталі, і працює він лише для різних лінійних коренів.

b-root:
  name: Другий корінь
  say: "«бе»"
  def: >-
    Інше значення, при якому знаменник обертається на нуль. Кожен корінь
    знаменника дає свій доданок у розклад.
  eg: >-
    Кратні корені — виняток: множнику, що трапляється k разів, потрібні всі
    степені від 1 до k, а не один доданок.

implies:
  name: Випливає
  say: "«отже», «звідки»"
  def: >-
    Те, що ліворуч, змушує те, що праворуч. Це одностороннє — зворотного воно не
    стверджує.
  eg: >-
    У заміні змінної він позначає момент, коли вибір окуповується: щойно
    підстановку обрано, спрощення випливає без подальших рішень.

plus:
  name: Знак плюс
  say: "«плюс»"
  def: >-
    Додавання. Між двома доданками він їх поєднує.
  eg: >-
    Під коренем він не розподіляється — √(a+b) не дорівнює √a + √b, і саме ця
    помилка робить інтеграли довжини дуги легшими на вигляд, ніж вони є.

one-const:
  name: Одиниця
  say: "«один»"
  def: >-
    Нейтральний елемент множення. У підінтегральному виразі це зазвичай слід
    чогось, що скоротилося, або доданок, свідомо доданий для повного квадрата.
  eg: >-
    Одиниця під коренем у довжині дуги — це горизонтальний пробіг; саме тому
    довжина дуги ніколи не буває коротшою за проміжок.

frac-bar:
  name: Дробова риска
  say: "«поділити на»"
  def: >-
    Ділення. Усе, що вгорі, ділиться на все, що внизу, — риска ще й групує, чого
    невидимі дужки в набраній формулі не зробили б.
  eg: >-
    Дріб, знаменник якого може обернутися на нуль, — звідси походить кожне
    питання про збіжність і невласні інтеграли в цьому курсі.

P-fn:
  name: Многочлен чисельника
  say: "«пе від ікс»"
  def: >-
    Верх раціональної функції. Його степінь має бути строго меншим за степінь
    знаменника, перш ніж розкладати.
  eg: >-
    Якщо ні — спершу поділіть кутом. Пропуск цього кроку дає лінійну систему без
    розв’язків — заплутаний спосіб про це дізнатися.

A-coef:
  name: Невизначена стала
  say: "«а»"
  def: >-
    Число, якого ви ще не знаєте. Розклад записують з невідомими чисельниками, а
    тоді їх знаходять.
  eg: >-
    Почергове підставляння коренів вбиває всі доданки, крім одного, — це значно
    швидше, ніж розкривати дужки й порівнювати коефіцієнти.

B-coef:
  name: Інша невизначена стала
  say: "«бе»"
  def: >-
    Одна невідома на кожен множник знаменника. Кількість вимушена — їх рівно
    стільки, скільки дозволяє степінь чисельника.
  eg: >-
    Незвідний квадратний множник отримує *лінійний* чисельник Ax+B, а не одну
    сталу. Одного ступеня свободи не вистачило б.

t-var:
  name: t — рухомий кінець або параметр
  say: "«те»"
  def: >-
    Змінна, що заступає те, до чого ви зараз перейдете до границі, або параметр,
    що описує криву. У будь-якому разі — це те, що рухається.
  eg: >-
    У невласному інтегралі саме t знову робить інтеграл власним: чесно
    інтегруєте до t, а тоді питаєте, що буде, коли t тікає.

A-area:
  name: Площа
  say: "«а»"
  def: >-
    Величина, що накопичується. Вона виходить додатною, бо підінтегральний вираз
    влаштували невід’ємним, а не тому, що площі такі.
  eg: >-
    Голий ∫f дає площу *зі знаком*. Облік знаків не зникає — ви зробили його
    заздалегідь, вирішивши, яка крива зверху.

V-vol:
  name: Об’єм
  say: "«ве»"
  def: >-
    Накопичена сума. Як завжди — внесок одного шару, додений до решти.
  eg: >-
    Єдине справжнє рішення — який шар обрати; інтеграл — та сама машина за
    будь-якого вибору.

pi-const:
  name: Пі
  say: "«пі»"
  def: >-
    Стала кола. Її поява тут — відбиток кругового перерізу: вона входить через
    площу круга πR².
  eg: >-
    У формулі оболонок вона приходить як 2πr — *довжина кола* розгорнутого
    аркуша. Та сама стала, інша геометрія.

R-outer:
  name: Зовнішній радіус
  say: "«велике ер від ікс»"
  def: >-
    Відстань від осі обертання до дальнього краю шару. Відстань до осі — а не
    значення f, хіба що вісь якраз є віссю x.
  eg: >-
    Обертання навколо y = 2 робить R рівним |f(x) − 2|. Явне врахування осі в
    радіусі — те, що рятує від збою завчених формул.

r-inner:
  name: Внутрішній радіус
  say: "«мале ер від ікс»"
  def: >-
    Відстань від осі до ближнього краю — отвір. Нуль, коли область торкається
    осі, і тоді шайба стає диском.
  eg: >-
    Віднімають *площі*, а не радіуси. π(R−r)² не описує жодної області і є
    стандартною помилкою в цій темі.

W-work:
  name: Робота
  say: "«дубль-ве»"
  def: >-
    Сила, помножена на відстань, накопичена. Стала сила робить це множенням; сила,
    що змінюється, — саме те, що вимагає інтеграла.
  eg: >-
    У задачі про відкачування кожен шар важить однаково, але проходить різну
    відстань — через цю асиметрію це й не може бути множенням.

F-force:
  name: Сила як функція положення
  say: "«еф від ікс»"
  def: >-
    Як сильно треба штовхати, коли ви в точці x. Якби вона була сталою, аналіз був
    би не потрібен.
  eg: >-
    Закон Гука F = kx — архетип. Задачі рідко дають k прямо — його виводять із
    речення на кшталт «10 Н розтягують її на 0,2 м».

L-len:
  name: Довжина дуги
  say: "«ель»"
  def: >-
    Відстань уздовж кривої, на відміну від прямої відстані між її кінцями.
  eg: >-
    Прочитана як ∫ швидкість dt, це весь пройдений шлях — тому двічі пройдене коло
    дає 4π, а не 2π.

x-of-t:
  name: x як функція t
  say: "«ікс від те»"
  def: >-
    Горизонтальна координата, задана як функція параметра, а не як незалежна
    змінна. Саме це звільняє криву від тесту вертикальної прямої.
  eg: >-
    Її похідна — горизонтальна складова швидкості. Там, де вона зникає, а y′ ні,
    дотична вертикальна.

y-of-t:
  name: y як функція t
  say: "«ігрек від те»"
  def: >-
    Вертикальна координата, теж керована параметром. Пара (x(t), y(t)) — це
    положення, а t фіксує, коли частинка там.
  eg: >-
    Виключення t відновлює форму, але викидає напрямок, швидкість і те, скільки
    разів криву пройдено.

dt:
  name: Диференціал часу
  say: "«де те»"
  def: >-
    Один нескінченно малий крок параметра. Усе, що його множить, — швидкість, а
    інтегрування перетворює швидкість на підсумок.
  eg: >-
    Швидкість × dt — це відстань. Саме це прочитання робить параметричну формулу
    довжини дуги очевидною, а не завченою.

a-term:
  name: n-й член
  say: "«а з індексом ен»"
  def: >-
    Один елемент послідовності — окреме число, вибране за своїм індексом. Не сума
    і не послідовність.
  eg: >-
    aₙ → 0 — необхідна умова збіжності ряду, але далеко не достатня. Гармонічний
    ряд — постійний контрприклад.

b-term:
  name: Член для порівняння
  say: "«бе з індексом ен»"
  def: >-
    Друга послідовність, обрана тому, що ви вже знаєте, чи збігається її ряд. Це
    мірило, а не те, що вимірюють.
  eg: >-
    Обирайте її, лишаючи тільки старший степінь у чисельнику й знаменнику, — саме
    це змушує відношення прямувати до чогось скінченного й ненульового.

S-partial:
  name: N-та часткова сума
  say: "«ес з індексом ен»"
  def: >-
    Сума перших N членів — звичайна скінченна сума, нічого нескінченного в ній
    немає.
  eg: >-
    Саме цей об’єкт узагалі робить нескінченні суми означуваними: ви ніколи не
    додаєте нескінченно багато, а стежите за послідовністю скінченних сум.

S-sum:
  name: Сума ряду
  say: "«ес»"
  def: >-
    Границя, до якої прямують часткові суми, коли вони до чогось прямують. Це
    границя, а не додавання.
  eg: >-
    Знання, що ряд збігається, майже ніколи не дає S. Геометричні й телескопічні
    ряди — рідкісні випадки, коли її можна назвати.

L-limit:
  name: Граничне значення
  say: "«ель»"
  def: >-
    До чого усталюється послідовність. В ознаці збіжності це не відповідь, а лише
    вердикт — результат вирішує її величина.
  eg: >-
    L = 1 в ознаці д’Аламбера справді нічого не каже, це не «майже»: і ∑1/n, і
    ∑1/n² дають рівно 1.

N-index:
  name: Індекс обривання
  say: "«ен»"
  def: >-
    Як далеко ви зайшли. Велика літера відрізняє його від біжучого індексу n, за
    яким сумують і який зникає.
  eg: >-
    n — зв’язаний і внутрішній; N — число, яке обираєте ви. Змішування їх —
    причина, чому міркування про часткові суми перестають мати сенс.

c-coef:
  name: n-й коефіцієнт
  say: "«це з індексом ен»"
  def: >-
    Фіксоване число, що множить n-й степінь. Коефіцієнти і є рядом; x — вхід, у
    якому його обчислюють.
  eg: >-
    Степеневий ряд — функція, дані якої — її *коефіцієнти*; тому його
    диференціювання — просто правило для коефіцієнтів.

a-center:
  name: Центр
  say: "«а»"
  def: >-
    Точка, навколо якої розкладають ряд, і точка, де збіжність гарантована за
    будь-яких умов.
  eg: >-
    Кожне питання про степеневий ряд насправді про відстань від a. При x = a ряд
    дорівнює просто c₀ і не може не збігтися.

R-radius:
  name: Радіус збіжності
  say: "«ер»"
  def: >-
    Половина ширини множини, де ряд збігається. Усередині — абсолютно; поза нею —
    ніяк.
  eg: >-
    R нічого не каже про два кінці — вони збігаються чи ні незалежно, і кожен
    треба перевіряти окремо вручну.

p-exp:
  name: Показник p
  say: "«пе»"
  def: >-
    Степінь, що вирішує збіжність, і єдине в ряді, що важить для вердикту.
  eg: >-
    p > 1 збігається на нескінченності, p < 1 — біля нуля. Вони вказують у
    протилежні боки, бо швидке спадання добре далеко, а різкий вибух погано
    зблизька.

less-than:
  name: Менше
  say: "«менше за»"
  def: >-
    Строга нерівність. Обидві частини не можуть бути рівними.
  eg: >-
    На межовому випадку строгість — увесь зміст: |x−a| < R нічого не каже про
    те, що буде при |x−a| = R.

le:
  name: Менше або дорівнює
  say: "«не більше за»"
  def: >-
    Межа, якої ліва частина може досягати.
  eg: >-
    В оцінці похибки це гарантія, а не прикидка — справжня похибка десь у цьому
    діапазоні, і в найгіршому випадку ви впевнені.

abs-bars:
  name: Модуль
  say: "«модуль»"
  def: >-
    Відстань від нуля — величина з відкинутим знаком.
  eg: >-
    Тут саме він робить ознаку ознакою *величини*, а не знака, — тому ознаки
    д’Аламбера й Коші доводять абсолютну збіжність, а знакопочережні ряди
    отримують задарма.

omega-space:
  name: Простір елементарних подій
  say: "«омега»"
  def: >-
    Кожен результат, який може дати експеримент, записаний по одному разу й без
    перекриттів. Зафіксуйте його перш за все — ймовірність приписують його
    підмножинам, тож хибний Ω робить хибним кожне подальше число.
  eg: >-
    Для двох кубиків Ω — це 36 упорядкованих пар, а не 11 можливих сум. Суми не
    рівноймовірні; пари — так, і саме тому їм віддають перевагу.

event-A:
  name: Подія
  say: "«а»"
  def: >-
    Підмножина простору елементарних подій — сукупність результатів, які ви
    вирішили вважати важливими. «Випала парна грань» — це множина {2, 4, 6}.
  eg: >-
    Події — це множини, тож мова множин і є мовою ймовірностей: «і» — перетин,
    «або» — об’єднання, «не» — доповнення.

event-B:
  name: Інша подія
  say: "«бе»"
  def: >-
    Друга підмножина того самого простору. Дві події можуть перекриватися,
    виключати одна одну або бути не пов’язаними — і це три справді різні речі.
  eg: >-
    Несумісні — не те саме, що незалежні. Неперетинні події залежні настільки,
    наскільки це взагалі можливо: якщо сталася одна, другої точно не було.

prob-P:
  name: Ймовірнісна міра
  say: "«ймовірність»"
  def: >-
    Функція, що приймає *множину* й повертає число з [0, 1]. Вона означена не на
    результатах, а на подіях, — тому P(A) має сенс, а «ймовірність трійки»
    потребує події {3}.
  eg: >-
    Усе випливає з трьох правил: вона ніколи не від’ємна, увесь простір має
    ймовірність 1, а неперетинні частини додаються. Більше нічого немає.

given:
  name: Риска умови
  say: "«за умови»"
  def: >-
    Усе праворуч від неї тепер вважається істинним. Вона не змінює світ — вона
    змінює простір, відносно якого ви вимірюєте.
  eg: >-
    P(A|B) і P(B|A) — різні числа, і плутанина між ними — найвагоміша помилка в
    цій темі. «Позитивний тест за умови хвороби» — не те саме, що «хвороба за
    умови позитивного тесту».

cap:
  name: Перетин
  say: "«і»"
  def: >-
    Результати, що належать обом подіям одночасно. Кожне «і» в текстовій задачі з
    ймовірностей — це цей символ.
  eg: >-
    P(A ∩ B) = P(A)P(B) — це *означення* незалежності, а не загальне правило.
    Застосування його до залежних подій — джерело більшості хибних відповідей.

cup:
  name: Об’єднання
  say: "«або»"
  def: >-
    Результати, що належать хоча б одній події. «Або» в ймовірностях —
    невиключне.
  eg: >-
    P(A ∪ B) не дорівнює P(A) + P(B), якщо події не неперетинні, — інакше
    перекриття порахують двічі, і його доведеться відняти.

card-bars:
  name: Скільки в ній елементів
  say: "«потужність»"
  def: >-
    Кількість результатів у множині. Корисна лише тоді, коли результати
    рівноймовірні, а це припущення моделі, а не факт.
  eg: >-
    Лічба працює, лише якщо рахувати правильні речі. Класичний провал — рахувати
    нерівноймовірні результати так, ніби вони рівноймовірні.

rv-X:
  name: Випадкова величина
  say: "«ікс»"
  def: >-
    Зовсім не змінна — а *функція* з результатів у числа. Вона приписує число
    кожному можливому наслідку, щоб його можна було усереднити.
  eg: >-
    Це означення — сенс усього апарату. Щойно результати мають числа, їх можна
    додавати, а додавання робить можливими граничні теореми.

rv-Y:
  name: Друга випадкова величина
  say: "«ігрек»"
  def: >-
    Ще одна функція на *тому самому* просторі — саме це дозволяє питати, як дві
    величини рухаються разом.
  eg: >-
    Дві випадкові величини з різних експериментів не мають спільного розподілу, і
    питати про їхню кореляцію безглуздо.

expect-E:
  name: Математичне сподівання
  say: "«математичне сподівання»"
  def: >-
    Довготривале середнє значення, зважене ймовірністю. Оператор на випадкових
    величинах, а не число, у яке щось підставляють.
  eg: >-
    Воно лінійне навіть для залежних величин — E[X+Y] = E[X]+E[Y] завжди. Це
    неймовірно корисно, і для дисперсії аналога немає.

var-op:
  name: Дисперсія
  say: "«дисперсія»"
  def: >-
    Очікувана квадратична відстань від середнього. Квадрат — щоб не скорочувалося;
    звідси й одиниці — квадрат одиниць X.
  eg: >-
    Var(X+Y) = Var(X)+Var(Y) вимагає незалежності. Сподіванню така умова не
    потрібна, і забути про цю різницю — стандартна помилка.

cov-op:
  name: Коваріація
  say: "«коваріація»"
  def: >-
    Чи мають дві величини звичку бути вище своїх середніх разом. Додатна — якщо
    рухаються разом, від’ємна — якщо протилежно, нуль — якщо ні те, ні те.
  eg: >-
    Нульова коваріація не означає незалежності. X і X² на симетричному проміжку
    мають нульову коваріацію, хоча одна повністю визначає іншу.

mu-mean:
  name: Середнє
  say: "«мю»"
  def: >-
    Центр розподілу — математичне сподівання, записане як фіксоване число, бо це
    властивість розподілу, а не вибірки.
  eg: >-
    μ — те, що ви намагаєтеся дізнатися; вибіркове середнє — ваша оцінка цього.
    Тримати їх окремо — більша частина того, про що дбає статистика.

sigma-sd:
  name: Стандартне відхилення
  say: "«сигма»"
  def: >-
    Квадратний корінь з дисперсії, що повертає розкид в одиниці X, щоб його можна
    було порівняти із середнім.
  eg: >-
    Це природна лінійка для відстані від середнього. «Три сигми» щось означають
    для будь-якого розподілу; «три одиниці» — нічого.

lambda-rate:
  name: Інтенсивність
  say: "«лямбда»"
  def: >-
    Подій на одиницю часу чи простору. Це і середнє, і дисперсія пуассонівської
    лічби — сильне твердження про реальні дані, яке можна перевірити.
  eg: >-
    Якщо дисперсія ваших даних значно перевищує середнє, це не Пуассон —
    надмірна дисперсія зазвичай означає скупчення, яких модель не допускає.

binom-coef:
  name: Біноміальний коефіцієнт
  say: "«це з ен по ка»"
  def: >-
    Скількома способами вибрати k речей з n, коли порядок не важливий. Це
    *кількість*, а не ймовірність.
  eg: >-
    Саме він перетворює «одну конкретну послідовність успіхів» на «будь-яку
    послідовність із такою кількістю успіхів» — тому біноміальна формула має три
    множники, а не два.

p-prob:
  name: Ймовірність успіху
  say: "«пе»"
  def: >-
    Шанс успіху в одному випробуванні, що вважається однаковим щоразу й не
    залежить від інших випробувань.
  eg: >-
    Обидва припущення на практиці постійно порушуються. Витягування без
    повернення ламає їх, тому для цього випадку потрібен інший розподіл.

n-trials:
  name: Кількість випробувань
  say: "«ен»"
  def: >-
    Скільки разів повторюють експеримент. Фіксоване заздалегідь — саме це
    відрізняє біноміальний розподіл від розподілів часу очікування.
  eg: >-
    Якщо ви зупиняєтеся, коли *заманеться*, n не фіксоване й біноміальний
    розподіл не застосовний. Довільна зупинка тихо руйнує модель.

k-count:
  name: Кількість успіхів
  say: "«ка»"
  def: >-
    Значення, про яке питають, — скільки з n випробувань вдалися. Саме цьому
    дорівнює випадкова величина.
  eg: >-
    k пробігає від 0 до n, і ймовірності на всьому цьому діапазоні мають у сумі
    давати 1. Це безкоштовна перевірка будь-якої відповіді.

e-const:
  name: Число Ейлера
  say: "«е»"
  def: >-
    Приблизно 2,718. Воно з’являється всюди, де щось наростає неперервно, тому є
    в кожній формулі часу очікування й граничної лічби.
  eg: >-
    У розподілі Пуассона це те, що лишається від (1 − λ/n)ⁿ, коли n прямує до
    нескінченності, — відбиток перейденої границі.

density-f:
  name: Густина ймовірності
  say: "«еф від ікс»"
  def: >-
    Ймовірність на одиницю довжини, а не ймовірність. Вона може перевищувати 1, і
    f(x) сама по собі не є шансом чогось.
  eg: >-
    Для неперервної величини P(X = x) = 0 для кожного окремого x. Ймовірність
    мають лише проміжки, тому густину й доводиться інтегрувати.

cdf-F:
  name: Функція розподілу
  say: "«велике еф від ікс»"
  def: >-
    Ймовірність потрапити в x або нижче. Вона накопичує густину, тож є рівно її
    інтегралом — той самий зв’язок, що в основній теоремі аналізу.
  eg: >-
    На відміну від густини, вона завжди означає ймовірність, завжди йде від 0 до
    1 і існує для дискретних і неперервних величин однаково.

xbar:
  name: Вибіркове середнє
  say: "«ікс з рискою»"
  def: >-
    Середнє n спостережень. Воно саме випадкове — інша вибірка дасть інше
    значення, — і граничні теореми саме про це.
  eg: >-
    Його середнє дорівнює μ за будь-якого n; зі зростанням n меншає його розкид.
    Ця різниця — увесь зміст закону великих чисел.

sim-dist:
  name: Має розподіл
  say: "«має розподіл»"
  def: >-
    Називає, якому розподілу підкоряється випадкова величина. Не рівність — це про
    те, як розкидані значення, а не про те, яке з них конкретне.
  eg: >-
    X ∼ N(0,1) нічого не каже про значення X у конкретному випробуванні, лише про
    картину за багатьох.

normal-N:
  name: Нормальний розподіл
  say: "«нормальний»"
  def: >-
    Дзвоноподібна крива, повністю визначена середнім і дисперсією. Два числа
    задають усю форму.
  eg: >-
    Його важливість не в тому, що дані часто нормальні — часто ні, — а в тому, що
    *середні* нормальні майже незалежно від того, що вони усереднюють.

to-arrow:
  name: Прямує до
  say: "«прямує до»"
  def: >-
    Ліва частина стає й лишається як завгодно близькою до правої, коли індекс
    росте. Границя, з усіма звичними застереженнями про те, що до чого наближається.
  eg: >-
    У теорії ймовірностей за цією однією стрілкою ховається кілька нееквівалентних
    видів збіжності, і граничні теореми обирають різні.

ge:
  name: Більше або дорівнює
  say: "«не менше за»"
  def: >-
    Межа, якої ліва частина може досягати.
  eg: >-
    В оцінці хвоста напрямок украй важливий — ви питаєте, скільки ймовірності
    лежить *за* порогом, а не на ньому.

greater-than:
  name: Більше
  say: "«більше за»"
  def: >-
    Строга нерівність: ліва частина перевищує праву, рівність виключена. Яка
    частина більша — зазвичай увесь зміст теореми.
  eg: >-
    Доведення збіжності тримаються на строгих нерівностях — «для кожного ε > 0»
    було б порожнім, якби ε могло дорівнювати нулю.

ne:
  name: Не дорівнює
  say: "«не дорівнює»"
  def: >-
    Заперечує тотожність, і нічого більше — не каже, яка частина більша чи
    наскільки.
  eg: >-
    P(A ∩ B) ≠ P(A)P(B) — означення залежності: правило добутку не справджується,
    але не сказано, в який бік тягнуть події.

approx:
  name: Приблизно дорівнює
  say: "«приблизно»"
  def: >-
    Обидві частини близькі, а розмір розриву не названо. Чесний символ лише тоді,
    коли щось інше фіксує похибку.
  eg: >-
    Кожне ≈ у цій бібліотеці має десь супутню оцінку — залишковий член, радіус,
    оцінку хвоста. Без неї це надія, а не твердження.

much-less:
  name: Значно менше
  say: "«значно менше за»"
  def: >-
    Менше настільки, що різниця змінює висновок, — твердження про масштаб, а не
    точний порядок.
  eg: >-
    Вживається, коли член от-от відкинуть. Стверджується, що його збереження не
    зрушило б відповідь.

propto:
  name: Пропорційно
  say: "«пропорційно»"
  def: >-
    Рівність з точністю до сталого множника, який свідомо опущено, — зазвичай
    тому, що його потім відновлять нормуванням.
  eg: >-
    Апостеріорна ∝ правдоподібність × апріорна: відсутня стала — це свідчення, і
    її завжди можна повернути, зробивши суму рівною 1.

iff:
  name: Тоді й лише тоді
  say: "«тоді й лише тоді, коли»"
  def: >-
    Справджуються обидва напрямки, тож обидві частини взаємозамінні. Строго
    сильніше за ⇒ і набагато важче заслужити.
  eg: >-
    Більшість ознак збіжності дають лише один напрямок. Коли ознака є ⟺, вона
    може довести й розбіжність — тому такі цінні.

cdot:
  name: Крапка множення
  say: "«помножити на»"
  def: >-
    Звичайне множення, записане крапкою там, де просте сусідство було б
    двозначним, — між двома названими величинами або після закритої дужки.
  eg: "P(A) · P(B) ставить видимий проміжок між двома ймовірностями, які не є одним символом."

times-op:
  name: Знак множення
  say: "«помножити на»"
  def: >-
    Той самий добуток, що й ·, для місць, де множники самі є виразами й оку
    потрібен більший роздільник.
  eg: "Також декартів добуток, коли стоїть між двома множинами, а не числами."

pm:
  name: Плюс-мінус
  say: "«плюс-мінус»"
  def: >-
    Два твердження, записані як одне, — візьміть по разу з кожним знаком. У смузі
    похибки означає симетричний проміжок навколо значення.
  eg: "μ ± 2σ — проміжок, а не число, і означає 95% лише для нормального розподілу."

in-member:
  name: Належить
  say: "«належить»"
  def: >-
    Належність: те, що ліворуч, — один з елементів множини праворуч. Зауважте: це
    зв’язок елемента з множиною, ніколи — множини з множиною.
  eg: "ω ∈ A — ось що насправді означає «подія сталася»."

subseteq:
  name: Є підмножиною
  say: "«міститься в»"
  def: >-
    Кожен елемент лівої множини є і в правій. На відміну від ∈, це зв’язок двох
    множин, і саме він робить ймовірність монотонною.
  eg: "A ⊆ B змушує P(A) ≤ P(B) — менша подія не може бути ймовірнішою."

setminus:
  name: Різниця множин
  say: "«без»"
  def: >-
    Що лишається від першої множини, коли з неї прибрали все, що є в другій.
    Порядок важливий: операція не симетрична.
  eg: "Ω ∖ A — доповнення, усе, що означає, що A не сталася."

empty-set:
  name: Порожня множина
  say: "«порожня множина»"
  def: >-
    Множина, у якій нічого немає, — подія, що не може статися. Вона одна, тому
    «неперетинні» можна записати рівністю.
  eg: "A ∩ B = ∅ каже, що обидві події не можуть статися разом, — і тому їхні ймовірності додаються."

ellipsis:
  name: І так далі
  say: "«і так далі»"
  def: >-
    Твердження, що закономірність продовжується очевидним чином. Єдиний знак тут
    без формального змісту — те, що він ховає, має бути сказано деінде.
  eg: >-
    У ряді він ховає все питання: a + a + ⋯ має сенс лише тоді, коли означено
    границю часткових сум.

zero-const:
  name: Нуль
  say: "«нуль»"
  def: >-
    Нейтральний елемент додавання, а в цій бібліотеці зазвичай межа: значення, до
    якого прямує границя, ймовірність того, що не може статися, точка, де похідна
    змінює напрямок функції.
  eg: >-
    Нульова ймовірність — не те саме, що неможливість, щойно результати
    неперервні: її має кожна окрема точка.

delta-change:
  name: Зміна
  say: "«дельта»"
  def: >-
    Скінченна різниця: пізніше значення мінус раннє. Саме вона стає диференціалом
    після переходу до границі.
  eg: "Δ можна виміряти; d — ідеалізація, яку отримують, стискаючи Δ до нуля."

d-deriv:
  name: Оператор похідної
  say: "«де»"
  def: >-
    Саме над дробовою рискою d — не величина: d/dx — один символ, що означає
    «швидкість зміни за x того, що стоїть далі».
  eg: >-
    d у dy/dx не можна скорочувати як множники. Те, що запис створює таку
    ілюзію, — причина, чому правило ланцюжка здається очевидним.

dy:
  name: Нескінченно малий крок по y
  say: "«де ігрек»"
  def: >-
    Зникомо мала зміна виходу — вертикальний катет трикутника, нахил якого є
    похідною.
  eg: "dy = f′(x) dx — твердження, що біля точки крива є своєю дотичною."

ds:
  name: Нескінченно малий шматок дуги
  say: "«де ес»"
  def: >-
    Зникомо малий крок, виміряний *уздовж* кривої, а не вздовж осі, — тому він
    з’являється як √(dx² + dy²).
  eg: "Довжина дуги й площа поверхні — обидві інтеграли чогось по ds."

ln-fn:
  name: Натуральний логарифм
  say: "«логарифм натуральний»"
  def: >-
    Обернена до e^x: ln y — показник, до якого треба піднести e, щоб отримати y.
    Він перетворює добутки на суми — здебільшого для цього й існує.
  eg: >-
    Він росте необмежено, але повільніше за будь-який додатний степінь x, — тому
    ∑1/n розбігається, а ∑1/n^1.01 ні.

tan-fn:
  name: Тангенс
  say: "«тангенс»"
  def: >-
    sin поділити на cos — нахил променя під кутом θ. Вибухає там, де cos дорівнює
    нулю, тому його інтеграли вимагають обережності біля ±π/2.
  eg: "У тригонометричній підстановці x = a tan θ обирають саме тому, що 1 + tan² = sec²."

sec-fn:
  name: Секанс
  say: "«секанс»"
  def: >-
    Одиниця поділити на косинус. Має власну назву здебільшого тому, що його похідна
    й квадрат постійно трапляються в інтегруванні.
  eg: "sec² — похідна tan, і саме це замикає підстановку з тангенсом."

csc-fn:
  name: Косеканс
  say: "«косеканс»"
  def: Одиниця поділити на синус — пара до sec, з переставленими ролями sin і cos.
  eg: "Кожна тотожність із sec і tan має дзеркальне відображення з csc і cot."

cot-fn:
  name: Котангенс
  say: "«котангенс»"
  def: cos поділити на sin. Нуль там, де tan вибухає, і навпаки.
  eg: "З’являється, коли підстановку роблять через доповняльний кут."

arcsin-fn:
  name: Арксинус
  say: "«арксинус»"
  def: >-
    Кут, синус якого дорівнює входу. Функцією він стає лише після обмеження виходу
    проміжком [−π/2, π/2] — без цього синус не взаємно однозначний.
  eg: "Через це обмеження тригонометрична підстановка мусить перевіряти, на яку гілку потрапляє."

arctan-fn:
  name: Арктангенс
  say: "«арктангенс»"
  def: >-
    Кут, тангенс якого дорівнює входу, узятий в (−π/2, π/2). Обмежений — тому це
    природна первісна чогось, що згасає.
  eg: "∫dx/(1+x²) = arctan x + C — обмежена відповідь пояснює, чому цей інтеграл збігається."

Phi-cdf:
  name: Функція розподілу стандартного нормального
  say: "«велике фі»"
  def: >-
    Ймовірність того, що стандартна нормальна величина потрапить у z або нижче.
    Елементарної формули немає, тому її табулюють, а не обчислюють.
  eg: "Кожне питання про нормальний розподіл стає питанням про Φ після стандартизації до Z."

max-op:
  name: Максимум
  say: "«найбільше»"
  def: >-
    Найбільше значення в сукупності, коли воно існує. На відкритому проміжку його
    може не бути — саме цю прогалину заповнює супремум.
  eg: >-
    В оцінці похибки максимум на проміжку перетворює невідому похідну на число,
    яким справді можна скористатися.

T-taylor:
  name: Многочлен Тейлора
  say: "«те з індексом ен»"
  def: >-
    Обрізання ряду Тейлора до степеня N — многочлен, завжди скінченний, завжди
    означений, незалежно від того, чи збігається ряд, з якого він походить.
  eg: "f = T_N + R_N — тотожність, а не наближення. Усі сумніви живуть у R_N."

Z-score:
  name: Стандартизована величина
  say: "«зет»"
  def: >-
    Те, що лишається після віднімання середнього й ділення на стандартне
    відхилення: величина, виміряна в стандартних відхиленнях, а не в одиницях.
  eg: "Саме стандартизація дозволяє одній таблиці нормального розподілу служити кожному нормальному розподілу."

C-const:
  name: Стала інтегрування
  say: "«це»"
  def: >-
    Інформація, яку невизначений інтеграл не може відновити. Диференціювання
    знищує сталі, тож пошук первісної може повернути лише цілу родину.
  eg: >-
    У визначеному інтегралі вона зникає, бо F(b) − F(a) її віднімає, — тому
    основній теоремі байдуже, яку первісну ви оберете.

M-bound:
  name: Оцінка зверху
  say: "«ем»"
  def: >-
    Число, обране не меншим за щось, чого ви не можете обчислити точно, — зазвичай
    за величину похідної на проміжку.
  eg: "Будь-яке коректне M дає коректну оцінку похибки; менше M дає кориснішу."

h-step:
  name: Малий крок
  say: "«аш»"
  def: >-
    Зсув, який от-от спрямують до нуля, або товщина одного шару в сумі, що от-от
    стане інтегралом.
  eg: "Уся диференціальна частина аналізу — це одна границя при h → 0."

s-arc:
  name: Відстань уздовж кривої
  say: "«ес»"
  def: >-
    Положення, виміряне тим, скільки ви пройшли вздовж кривої, а не тим, де ви на
    площині. Не залежить від того, як швидко біжить параметр.
  eg: >-
    Дві параметризації однієї кривої скрізь розходяться щодо t і сходяться щодо
    s — тому довжина дуги є властивістю самої кривої.

w-width:
  name: Ширина шару
  say: "«дубль-ве»"
  def: >-
    Наскільки широкий переріз на даній висоті — множник, що перетворює товщину
    шару на його площу.
  eg: "У задачі про тиск на греблю w(y) — це місце, де входить форма греблі."

I-value:
  name: Інтеграл, що обчислюється
  say: "«і»"
  def: >-
    Назва для невідомого значення інтеграла, щоб з ним можна було поводитися як з
    алгебраїчною величиною й розв’язати рівняння відносно нього.
  eg: >-
    Фокус з інтегруванням e^x sin x: двічі частинами, повертаємося до I і
    розв’язуємо рівняння замість інтеграла.

epsilon-small:
  name: Як завгодно малий допуск
  say: "«епсилон»"
  def: >-
    Додатне число, яке може вибирати *читач*, хоч яке мале. Твердження полягає в
    тому, що воно справджується, хоч який підступний вибір.
  eg: >-
    «Для кожного ε > 0» перетворює розмите «наближається» на щось, що справді
    можна довести чи спростувати.

rho-corr:
  name: Коефіцієнт кореляції
  say: "«ро»"
  def: >-
    Коваріація, поділена на обидва стандартні відхилення, що заганяє її в [−1, 1]
    і робить безрозмірною, — міра лише *лінійного* зв’язку.
  eg: "ρ = 0 не означає незалежності: y = x² на симетричному проміжку має ρ = 0."

omega-outcome:
  name: Окремий результат
  say: "«мала омега»"
  def: >-
    Один повний результат експерименту — точка Ω, а не підмножина. Події — це
    множини таких точок.
  eg: "Випадкова величина — функція від ω: X(ω) перетворює результат на число."

reals:
  name: Дійсні числа
  say: "«дійсні числа»"
  def: >-
    Кожна точка числової прямої, разом із «проміжками», — раціональні числа плюс
    усі границі, до яких вони прямують. Повнота — та властивість, якою аналіз
    насправді користується.
  eg: >-
    «Означена на всьому ℝ» — сильне твердження: воно виключає проколи, де
    знаменник обертається на нуль, а саме там живуть прості дроби.

set-braces:
  name: Фігурні дужки множини
  say: "«множина»"
  def: >-
    Множина, задана переліком елементів. Дужки не несуть ні порядку, ні повторень —
    той самий перелік, записаний інакше, є тією самою множиною.
  eg: >-
    {ГГ, ГР, РГ, РР} має чотири елементи; {Г, Р} — два. Котра з них простір
    елементарних подій, залежить від того, скільки монет ви домовилися кинути.

z-value:
  name: Стандартизоване значення
  say: "«зет»"
  def: >-
    Конкретна кількість стандартних відхилень від середнього — точка, у якій
    обчислюють нормальну ймовірність після ділення на одиниці.
  eg: "z = 1.96 — це 97,5-й процентиль, звідки й береться 95-відсотковий інтервал."

event-C:
  name: Третя подія
  say: "«це»"
  def: >-
    Ще одна підмножина Ω. Три події — найменший випадок, коли попарна незалежність
    і незалежність у сукупності розходяться.
  eg: >-
    A, B і C можуть бути незалежними в кожній парі й усе одно разом визначати одна
    одну — тому означення мусить перевіряти всі підмножини.

event-D:
  name: Названа подія
  say: "«де»"
  def: >-
    Літера, обрана позначати, *чим* є подія, а не її місце в списку, — D для
    дефектного виробу, R для дощу.
  eg: "Коли подію названо за самою річчю, напрямок умови важче переплутати."

from-arrow:
  name: Випливає з
  say: "«успадковано від»"
  def: >-
    Читається справа наліво: твердження ліворуч є наслідком того, що праворуч.
    Позначає результат, що імпортується, а не виводиться тут.
  eg: >-
    Границя послідовності, успадкована від границі функції, працює лише в цей бік.
    Функція може вирішити долю послідовності; послідовність не може вирішити долю
    функції.

complement:
  name: Доповнення
  say: "«не»"
  def: >-
    Усе в Ω, що не належить події, — записане верхнім індексом, який легко
    загубити при швидкому читанні.
  eg: >-
    P(A) + P(Aᶜ) = 1 — найкорисніший рядок у теорії ймовірностей: важка подія
    часто є доповненням легкої.

r-ratio:
  name: Знаменник прогресії
  say: "«ер»"
  def: >-
    Множник, на який множать кожен член геометричного ряду, щоб отримати
    наступний. Уся доля ряду — у тому, чи |r| < 1.
  eg: >-
    При |r| < 1 сума дорівнює a/(1−r); при |r| ≥ 1 члени навіть не прямують до
    нуля. Межового випадку для суперечок немає.

rho-density:
  name: Густина
  say: "«ро»"
  def: >-
    Маса на одиницю об’єму, стала, якщо задача не каже інакше. Саме вона
    перетворює геометричний об’єм на вагу.
  eg: "ρg — вага на одиницю об’єму, множник, що перетворює об’єм шару на силу, яка на нього діє."

S-surface:
  name: Площа поверхні
  say: "«ес»"
  def: >-
    Площа, яку замітає крива, обертаючись навколо осі: довжина кола на довжину
    дуги, накопичена.
  eg: >-
    2πr у підінтегральному виразі — довжина кола, а ds — похила довжина;
    використати dx натомість — класичний спосіб тут помилитися.

d-distance:
  name: Відстань
  say: "«де»"
  def: >-
    Наскільки щось переміщується. У задачі на роботу це *шлях* одного шару, який
    зазвичай залежить від того, звідки шар почав.
  eg: >-
    W = F·d лише тоді, коли сила стала й кожна частина проходить ту саму відстань;
    інтеграл існує тому, що зазвичай не виконується ні те, ні те.

hat-est:
  name: Дашок оцінки
  say: "«з дашком»"
  def: >-
    Дашок означає «наше найкраще припущення про», а не «саму річ». x — де система
    насправді; x̂ — у що вірить фільтр, а різниця між ними — величина, якої ніхто
    ніколи не спостерігає.
  eg: >-
    Кожна величина з дашком несе поруч коваріацію, що каже, наскільки їй довіряти.
    Дашок без коваріації — оцінка, якою не можна скористатися.

transpose:
  name: Транспонування
  say: "«транспоноване»"
  def: >-
    Відбити матрицю відносно діагоналі — рядок i стає стовпцем i. Перетворює
    вектор-стовпець на рядок і обертає порядок множників у добутку.
  eg: >-
    Воно з’являється парами, як AΣAᵀ, бо коваріація — *квадратична* річ. Одиноке
    транспонування у формулі коваріації — майже завжди друкарська помилка.

x-state:
  name: Стан
  say: "«ікс»"
  def: >-
    Найкоротший перелік чисел, що разом із моделлю визначає майбутнє системи.
    Положення й швидкість, а не саме положення, — бо саме положення не каже, куди
    об’єкт рушить далі.
  eg: >-
    Вибір стану — єдине модельне рішення, яке фільтр не може виправити за вас.
    Пропустіть величину — і фільтр списуватиме її вплив на шум.

P-cov:
  name: Коваріація оцінки
  say: "«пе»"
  def: >-
    Власне твердження фільтра про те, наскільки хибна його оцінка: симетрична
    матриця, діагональ якої містить дисперсію кожної компоненти стану, а
    позадіагональні елементи кажуть, як їхні похибки рухаються разом.
  eg: >-
    P — переконання, а не вимірювання. Фільтр із малою P і великою похибкою не
    працює добре — він бреше, і саме за цією поломкою треба стежити.

F-transition:
  name: Матриця переходу стану
  say: "«еф»"
  def: >-
    Фізика, записана матрицею: куди потрапить стан за один часовий крок, якщо
    ніщо його не збурить. Для сталої швидкості це матриця, що додає v·Δt до
    положення й лишає v без змін.
  eg: >-
    Кожен нуль у F — твердження, що одна компонента стану не впливає на іншу. Ці
    твердження і є моделлю, і саме вони ламаються першими.

H-observation:
  name: Матриця спостереження
  say: "«аш»"
  def: >-
    Що показав би датчик, якби стан був рівно x, а датчик — ідеальним. Вона
    відображає стан у простір вимірювань, зазвичай проєкцією на меншу кількість
    вимірів.
  eg: >-
    H зазвичай не квадратна й ніколи не обертається. Фільтр ніколи не питає «який
    стан дав цей показ» — він питає «що показав би цей стан».

K-gain:
  name: Коефіцієнт підсилення Калмана
  say: "«ка»"
  def: >-
    Скільки несподіванки прийняти на віру. Біля нуля він ігнорує датчик і їде на
    моделі; біля одиниці — викидає прогноз і йде за вимірюванням.
  eg: >-
    Його перераховують на кожному кроці з двох коваріацій — у цьому весь фокус:
    фільтр сам переналаштовує свою довіру, коли умови змінюються.

Q-proc-noise:
  name: Коваріація шуму процесу
  say: "«ку»"
  def: >-
    Наскільки хибна модель F за крок, виражене коваріацією, що додається при
    кожному прогнозі. Це бюджет фільтра на все, чого не врахувала фізика.
  eg: >-
    Q — член чесності. Поставте нуль — і фільтр зрештою стане таким упевненим, що
    жодне вимірювання його не зрушить, — саме так фільтри й розходяться.

R-meas-noise:
  name: Коваріація шуму вимірювань
  say: "«ер»"
  def: >-
    Наскільки шумний датчик. На відміну від Q, її часто можна дізнатися — з
    паспорта або залишивши датчик нерухомим і виміривши дисперсію його виходу.
  eg: >-
    R легко задати правильно, тому фільтр, що поводиться погано, — зазвичай
    проблема Q чи моделі в костюмі R.

z-meas:
  name: Вимірювання
  say: "«зет»"
  def: >-
    Що насправді повідомив датчик. Єдине в усьому фільтрі, що приходить ззовні, —
    усе інше є переконанням чи модельним вибором.
  eg: >-
    z живе в просторі вимірювань, а не станів. Порівнювати його з x напряму —
    помилка розмірності; його порівнюють з Hx̂, і в цьому сенс H.

y-innov:
  name: Інновація
  say: "«інновація»"
  def: >-
    Несподіванка: що сказав датчик мінус те, що фільтр очікував від нього почути.
    Це єдина нова інформація на кожному кроці — звідси й назва.
  eg: >-
    Інновації здорового фільтра схожі на білий шум. Якщо вони дрейфують чи
    автокорелюють, модель хибна в спосіб, який ховає коваріація.

S-innov-cov:
  name: Коваріація інновації
  say: "«ес»"
  def: >-
    Наскільки несподіваним фільтр очікував бути — прогнозований розкид інновації,
    що поєднує спроєктовану вперед невизначеність і власний шум датчика.
  eg: >-
    Ділення інновації на S — спосіб перевірити фільтр, не знаючи істини:
    результат має поводитися як стандартний нормальний, і зазвичай не поводиться.

I-identity:
  name: Одинична матриця
  say: "«одинична»"
  def: >-
    Одиниці на діагоналі, нулі скрізь решта. Множення на неї нічого не змінює,
    тож це матрична версія числа 1.
  eg: >-
    В оновленні коваріації I − KH — частка апріорної невизначеності, що пережила
    вимірювання. K = 0 лишає I, і нічого не вивчено.

Sigma-cov:
  name: Коваріаційна матриця
  say: "«сигма»"
  def: >-
    Багатовимірна заміна σ². Елемент (i,j) — коваріація компонент i та j, тож
    діагональ містить дисперсії, а решта — як компоненти спираються одна на одну.
  eg: >-
    Вона завжди симетрична й додатно напіввизначена. Саме ці дві властивості
    дозволяють малювати її еліпсом — і саме вони ламаються від поганої арифметики.

w-proc-noise:
  name: Шум процесу
  say: "«дубль-ве»"
  def: >-
    Випадковий поштовх, який світ дає системі між кроками, — вітер, вибоїна,
    незмодельоване прискорення. Його коваріація — Q.
  eg: >-
    Його ніколи не спостерігають і не обчислюють. У фільтр входить лише його
    коваріація, тому налаштовують Q, а не оцінюють w.

v-meas-noise:
  name: Шум вимірювань
  say: "«ве»"
  def: >-
    Похибка одного показу датчика. Вважається з нульовим середнім, незалежною від
    кроку до кроку й незалежною від шуму процесу — три припущення, кожне з яких
    варто перевірити.
  eg: >-
    Датчик зі зміщенням порушує припущення про нульове середнє, і виправлення —
    додати зміщення до стану й дати фільтру його оцінити.

k-step:
  name: Часовий крок
  say: "«ка»"
  def: >-
    На якому дискретному моменті ми зараз. Фільтр ніколи не бачить неперервного
    часу — він бачить послідовність кроків через Δt.
  eg: >-
    Індекс k|k−1 читається «на кроці k, за всього до кроку k−1». Ця риска справді
    є рискою умови, і запис саме це й означає.

u-control:
  name: Керувальний вхід
  say: "«у»"
  def: >-
    Що ви свідомо зробили із системою — відкрили дросель, подали напругу. Відомий
    точно, тож зсуває прогноз, не додаючи невизначеності.
  eg: >-
    Проведення відомого входу через B — безкоштовна точність. Пропустіть його — і
    Q мусить це поглинути, ставши достатньо великою, щоб покрити ваші власні дії.

B-control:
  name: Матриця керування
  say: "«бе»"
  def: >-
    Як керувальний вхід рухає стан за один крок. Для команди прискорення на стані
    «положення–швидкість» це стовпець (½Δt², Δt).
  eg: >-
    B і F — об’єкти одного роду: один діє на те, що ви обрали, інший — на те, де
    ви вже були.

A-matrix:
  name: Матриця
  say: "«а»"
  def: >-
    Лінійне відображення: приймає вектор і повертає вектор, роблячи це
    масштабуванням і додаванням, ніколи не згинанням. Саме це обмеження й
    зберігає гауссові розподіли гауссовими.
  eg: >-
    Ax — *рецепт*, а не множення чисел. Якщо читати стовпці A як «куди потрапляє
    кожен базисний вектор входу», більшість матричних тотожностей стають
    очевидними.

lambda-eigen:
  name: Власне значення
  say: "«лямбда»"
  def: >-
    Коефіцієнт розтягу вздовж напрямку, який матриця не обертає. Для коваріаційної
    матриці власні значення — дисперсії вздовж головних осей, а їхні квадратні
    корені — довжини півосей еліпса.
  eg: >-
    Коваріація з майже нульовим власним значенням майже вироджена — фільтр
    стверджує, що точно знає одну комбінацію станів, а так буває рідко.

trace-op:
  name: Слід
  say: "«слід»"
  def: >-
    Сума діагональних елементів. Для коваріаційної матриці це загальна дисперсія
    всіх компонент стану — одне число для «наскільки невизначено».
  eg: >-
    Підсилення, що мінімізує слід P, — це підсилення Калмана. Це один із двох
    шляхів до нього, і йому зовсім не потрібне гауссове припущення.

det-op:
  name: Визначник
  say: "«визначник»"
  def: >-
    Множник, у який відображення масштабує об’єм. Для коваріаційної матриці він
    вимірює об’єм еліпсоїда невизначеності — скільки місця оцінка лишає для
    істини.
  eg: >-
    Він стоїть під коренем у гауссовій густині, бо саме він нормує горб так, щоб
    інтеграл у n вимірах дорівнював 1.

partial-d:
  name: Частинна похідна
  say: "«де частинне»"
  def: >-
    Швидкість зміни за однією змінною, коли решта зафіксовані. Складені в таблицю,
    вони дають якобіан — найкраще лінійне наближення нелінійного відображення в
    точці.
  eg: >-
    Розширений фільтр Калмана — це цілком цей символ: замініть F і H якобіанами в
    поточній оцінці й усе одно запустіть лінійний фільтр.

h-meas-fn:
  name: Нелінійна модель вимірювання
  say: "«аш»"
  def: >-
    Що показує датчик як функція стану, коли ця функція не є матрицею, — дальність
    є квадратним коренем, азимут — арктангенсом.
  eg: >-
    Прогнозуйте самою h, а не її якобіаном. Використання лінеаризації для
    прогнозу вимірювання задарма викидає точність.

chi-sq:
  name: Хі-квадрат
  say: "«хі-квадрат»"
  def: >-
    Розподіл суми квадратів стандартних нормальних величин. Його середнє дорівнює
    кількості доданків — тому він готова статистика для перевірки.
  eg: >-
    Нормований квадрат інновації узгодженого фільтра має розподіл χ² із
    кількістю ступенів свободи, що дорівнює кількості компонент вимірювання.
    Середнє значно вище — фільтр надто самовпевнений.

rank-op:
  name: Ранг
  say: "«ранг»"
  def: >-
    Скільки незалежних напрямків матриця насправді досягає. Стос рядків може бути
    високим і мати низький ранг — тоді зайві рядки повторюють інформацію, яку вже
    несли попередні.
  eg: >-
    Повний ранг у тесті спостережуваності означає, що кожна компонента стану
    зрештою лишає слід у вимірюваннях. Будь-що менше називає комбінацію станів,
    якої фільтр ніколи не вивчить.

j-index:
  name: Другий лічильник
  say: "«йот»"
  def: >-
    Другий індекс, коли одного замало. У коваріаційній матриці пара (i, j) називає
    клітинку: як компоненти i та j змінюються разом.
  eg: >-
    Діагональ — там, де i дорівнює j, тому на діагоналі коваріаційної матриці
    звичайні дисперсії, а не щось нове.

gamma-gate:
  name: Поріг стробування
  say: "«гамма»"
  def: >-
    Найбільша нормована несподіванка, яку фільтр ще приймає. Вимірювання, чия
    інновація її перевищує, вважають викидом і відкидають, а не застосовують.
  eg: >-
    Беріть його з розподілу хі-квадрат — близько 9 для скалярного вимірювання,
    якщо потрібен строб у три сигми. Надто тісний — і фільтр, що розійшовся,
    відкидає кожен показ, який міг би його врятувати.

tau-time:
  name: Стала часу фільтра
  say: "«тау»"
  def: >-
    Наскільки довга пам’ять фільтра — приблизно скільки секунд минулих вимірювань
    ще впливають на поточну оцінку. Її повністю задає відношення шуму процесу до
    шуму вимірювань.
  eg: >-
    Довга τ добре згладжує й сильно запізнюється. Усталене відставання від сталого
    прискорення росте як τ², тож подвоєння згладжування вчетверо збільшує
    зміщення.

much-greater:
  name: Значно більше
  say: "«значно більше за»"
  def: >-
    Більше настільки, що менша частина перестає важити, — твердження про масштаб,
    а не точний порядок.
  eg: >-
    У підсиленні P ≫ R означає, що прогноз настільки розмитіший за датчик, що
    фільтр може просто йти за вимірюванням.

sigma-pos:
  name: Невизначеність положення
  say: "«сигма пе»"
  def: >-
    Стандартне відхилення оцінки положення — квадратний корінь з лівого верхнього
    елемента P, і число, яке фільтр зазвичай повідомляє як свою точність.
  eg: >-
    Це твердження, а не вимірювання. Порівняння його із фактичною похибкою — це
    перевірка узгодженості, і вони розходяться частіше, ніж ні.

sigma-vel:
  name: Невизначеність швидкості
  say: "«сигма ве»"
  def: >-
    Стандартне відхилення оцінки швидкості. У трекері лише за положенням її ніщо
    не вимірює напряму, тож вона зменшується повністю через кореляцію, яку
    створює прогноз.
  eg: >-
    Рух за інерцією перетворює її на невизначеність положення зі швидкістю Δt за
    крок — тому числення шляху деградує тим швидше, чим довше працює.

sigma-acc:
  name: Сила шуму процесу
  say: "«сигма а»"
  def: >-
    Наскільки сильно світу дозволено прискорювати систему у способи, яких модель
    не знає. Це єдиний скаляр, що масштабує всю Q для моделі сталої швидкості.
  eg: >-
    Обирайте його, відповідаючи на питання про систему, а не вдивляючись у графік:
    пішохід — близько 1 м/с², автомобіль — 3, квадрокоптер, що ухиляється, — 10.

p-position:
  name: Положення
  say: "«пе»"
  def: >-
    Де перебуває об’єкт — компонента стану, яка зазвичай вас цікавить, і єдина,
    яку схильний бачити простий датчик.
  eg: >-
    Вона рідко є всім станом. Фільтр, що оцінює лише положення, не може
    прогнозувати, бо положення зараз нічого не каже про положення потім.

v-velocity:
  name: Швидкість
  say: "«ве»"
  def: >-
    Темп зміни положення. Вона заслуговує місця в стані не тому, що її хтось хоче,
    а тому, що без неї майбутнє перестає залежати лише від теперішнього.
  eg: >-
    Зазвичай не вимірюється. Її вивчають через кореляцію з положенням, яку
    виготовляє крок прогнозу, — і більше ніяк.

m-meas-dim:
  name: Розмірність вимірювання
  say: "«ем»"
  def: >-
    Скільки чисел несе одне вимірювання. Задає розмір R і S та кількість ступенів
    свободи перевірки узгодженості.
  eg: >-
    Майже завжди значно менша за розмірність стану, тому єдина матриця, яку
    обертає фільтр, — дешева.

a-direction:
  name: Довільний напрямок
  say: "«а»"
  def: >-
    Перелік ваг, по одній на компоненту стану, що називає напрямок, про який
    питають. aᵀx — система, виміряна вздовж нього: стільки-то положення плюс
    стільки-то швидкості.
  eg: >-
    Квантифікація за всіма a перетворює твердження про одну матрицю на твердження
    про кожне питання, яке можна їй поставити.

c-scale:
  name: Спільний масштабний множник
  say: "«це»"
  def: >-
    Одне додатне число, що множить кілька величин одразу, — щоб з’ясувати, від чого
    вираз залежить, а що він лише повідомляє.
  eg: >-
    Помножте Q і R разом на c — підсилення не зміниться, а P помножиться на c; це
    доводить, що налаштування фільтра — одновимірна задача.
