# The lexicon. One entry per symbol; `formula` blocks in concepts reference these ids.
#
# kind: set | function | variable | constant | operator | differential
#   set          a collection of things
#   function     a machine: something goes in, something comes out
#   variable     a value that moves, or gets counted over
#   constant     a value pinned down before you start — often a boundary
#   operator     something that acts on whatever follows it
#   differential the marker of one infinitesimal slice
#
# glyph  what the reader sees.
# tex    the LaTeX that produces it, when different from the glyph. The indexer
#        checks this actually occurs in any formula that lists the symbol.
# match  the concatenated text of the rendered leaves, when different from the
#        glyph — e.g. \frac{1}{2} renders as "1" then "2". May be a list of
#        alternatives, tried in order.
# sel    a CSS selector into the rendered KaTeX, for marks that are not text at
#        all (a radical is an SVG). `swallow: true` with it means the mark owns
#        whatever text sits inside — without it, the pieces KaTeX assembles a ≠
#        from get tagged separately and clicking it reports "equals". Keep it
#        narrow: a selector cannot see text, so `.delimsizing` would claim a
#        tall bracket as readily as a tall bar.
# cls    a KaTeX class the matched leaf must carry, or must not when prefixed
#        with `!`. The only thing separating `\mid` from `|` in the output is
#        that one is a relation and the other is not.
# where  the tracks or fields this *sense* belongs to. The reader annotates
#        every formula against the whole lexicon, so `c` has to choose between
#        the mean-value c and the complement superscript; a sense at home wins,
#        and the same sense elsewhere loses to any local competitor.
# alt    other LaTeX spellings of the same mark (\tfrac for \frac). Only the
#        indexer reads these; the rendered output is identical either way.
# say    how to pronounce it out loud.
# def    what it is in general. A formula can override this locally via `notes:`.

integral:
  glyph: "∫"
  tex: "\\int"
  kind: operator
  name: Integral sign
  say: "“the integral of”"
  def: >-
    An elongated S, for sum. It says everything to its right is chopped into
    slices and added up, in the limit as the slices shrink to nothing.
  eg: >-
    It is not an instruction to antidifferentiate — that is only how you
    usually evaluate it.

sigma-sum:
  glyph: "∑"
  tex: "\\sum"
  kind: operator
  name: Summation sign
  say: "“the sum of”"
  def: >-
    Capital Greek sigma, for sum. Add one copy of what follows for every value
    of the index between the bottom and top limits.
  eg: "∑ from i=1 to n adds n terms. The ∫ is what this becomes in the limit."

limit:
  glyph: "lim"
  tex: "\\lim"
  kind: operator
  name: Limit
  say: "“the limit as”"
  def: >-
    The value being approached, not necessarily reached. Everything that makes
    calculus different from algebra is hiding in this word.
  eg: "lim as n→∞ means: take n bigger and bigger, and see what the answer settles on."

radical:
  glyph: "√"
  tex: "\\sqrt"
  sel: ".sqrt .hide-tail"
  kind: operator
  name: Square root
  say: "“the square root of”"
  def: The non-negative number whose square is what sits under the bar.
  eg: >-
    Under an integral it is usually bad news — √(1+f′²) is what makes most
    arc-length integrals impossible in closed form.

factorial:
  glyph: "!"
  kind: operator
  name: Factorial
  say: "“factorial”"
  def: "n! = n × (n−1) × … × 2 × 1. Grows faster than any exponential."
  eg: >-
    In a Taylor series it cancels the n! that differentiating xⁿ produces; in an
    error bound it is the term that makes adding more terms pay off.

prime:
  glyph: "′"
  tex: "'"
  kind: operator
  name: Derivative mark
  say: "“prime”"
  def: One derivative per tick. f′ is the rate of change of f.
  eg: "f⁽ⁿ⁾ with a bracketed number is the same idea once the ticks get unwieldy."

equals:
  glyph: "="
  kind: operator
  name: Equals
  say: "“equals”"
  def: >-
    A claim that both sides are the same object. Worth pausing on — in a
    definition it introduces notation, in a theorem it is the thing being proved.
  eg: >-
    The equals in the definition of ∫ is a definition; the one in the
    Fundamental Theorem had to be earned.

infinity:
  glyph: "∞"
  tex: "\\infty"
  kind: constant
  name: Infinity
  say: "“infinity”"
  def: >-
    Not a number — a direction. It only ever appears underneath a limit, which
    is what gives it meaning.
  eg: >-
    An integral to ∞ is shorthand for a limit, which is exactly why improper
    integrals need one.

bound-a:
  glyph: "a"
  kind: constant
  name: Lower limit
  say: "“ay”"
  def: >-
    Where the accumulation starts. In a Taylor series the same letter is the
    centre — the point everything is measured from.
  eg: "Swap a and b and the integral changes sign. Orientation is part of the definition."

bound-b:
  glyph: "b"
  kind: constant
  name: Upper limit
  say: "“bee”"
  def: Where the accumulation stops.
  eg: "∫ from a to b, then F(b) − F(a): the upper limit is the one you evaluate first."

alpha-bound:
  glyph: "α"
  tex: "\\alpha"
  kind: constant
  name: Starting angle
  say: "“alpha”"
  def: The angle where the sweep begins.
  eg: >-
    Choosing α and β so the region is traced exactly once is the whole difficulty
    of a polar area problem.

beta-bound:
  glyph: "β"
  tex: "\\beta"
  kind: constant
  name: Ending angle
  say: "“beta”"
  def: The angle where the sweep stops.
  eg: "Reaching for 0 to 2π out of habit is how regions get counted twice."

half:
  glyph: "½"
  tex: "\\frac"
  alt: ["\\tfrac", "\\dfrac"]
  sel: ".mfrac"
  kind: constant
  name: The one-half
  say: "“a half”"
  def: >-
    Not a fudge factor. A sector of angle dθ is the fraction dθ/2π of a full
    circle of area πr², and the 2π cancels down to ½.
  eg: "Its presence is the tell that you are adding sectors, not rectangles."

c-mean:
  glyph: "c"
  where: [calculus-2]
  kind: constant
  name: The unknown interior point
  say: "“see”"
  def: >-
    Some point between the centre and x. The theorem guarantees it exists but
    never tells you where, which is why the formula gets used as a bound.
  eg: >-
    Replace f⁽ᴺ⁺¹⁾(c) by its maximum over the interval and the equality becomes
    a usable inequality.

f-fn:
  glyph: "f"
  kind: function
  name: The function
  say: "“eff”"
  def: >-
    The thing being integrated, differentiated or approximated. Feed it a number,
    get a number back.
  eg: "In ∫f(x)dx, f supplies the height of every slice."

F-antideriv:
  glyph: "F"
  kind: function
  name: An antiderivative
  say: "“capital eff”"
  def: >-
    Any function whose derivative is f. Capitalization is the convention that
    signals the relationship.
  eg: >-
    “Any” is exact: antiderivatives differ by a constant, and that constant
    cancels in F(b) − F(a).

r-fn:
  glyph: "r"
  kind: function
  name: The radius function
  say: "“arr”"
  def: >-
    Distance from the origin at a given angle. In polar work r is a function of
    θ, not an independent variable.
  eg: "Where r = 0, one loop of the curve closes and the next opens."

remainder:
  glyph: "R"
  match: ["RN", "R"]
  kind: function
  name: The remainder
  say: "“arr sub en”"
  def: >-
    Exactly what the truncated polynomial got wrong — f minus its own Taylor
    polynomial. Not an estimate: an identity.
  eg: "The series equals the function precisely when R_N → 0."

x-var:
  glyph: "x"
  kind: variable
  name: The variable
  say: "“ex”"
  def: >-
    What varies. Inside a definite integral it is a dummy: it is consumed by the
    integration and does not appear in the answer.
  eg: "∫f(x)dx and ∫f(t)dt are the same number. Renaming a dummy changes nothing."

n-index:
  glyph: "n"
  kind: variable
  name: Number of pieces
  say: "“en”"
  def: How many slices, terms or steps. Always a positive integer, always headed for ∞.
  eg: "Doubling n halves Δx. The two always move together."

i-index:
  glyph: "i"
  kind: variable
  name: The counter
  say: "“eye”"
  def: >-
    Which term you are on. It exists only between the limits of the ∑ and is
    invisible outside it.
  eg: "A subscript i is a counter, never a power."

sample-point:
  glyph: "xᵢ*"
  tex: "x_i^*"
  match: "xi∗"
  kind: variable
  name: Sample point
  say: "“ex sub eye star”"
  def: >-
    Where inside slice i you measure the height. The star flags that the choice
    is yours — left edge, right edge, midpoint, anywhere.
  eg: >-
    For a continuous f every choice gives the same limit, which is why the
    definition can say “pick any”.

theta-var:
  glyph: "θ"
  tex: "\\theta"
  kind: variable
  name: The angle
  say: "“theta”"
  def: Direction from the origin, measured counterclockwise from the positive x-axis.
  eg: "In polar coordinates θ is the parameter you sweep, and r is what responds."

dx:
  glyph: "dx"
  kind: differential
  name: The differential
  say: "“dee ex”"
  def: >-
    The width of one infinitesimal slice, and the marker saying which variable is
    being swept. It closes the ∫ the way a bracket closes a group.
  eg: >-
    f(x)·dx is height × width — the area of one slice. Change it to dθ and you
    are sweeping a different axis entirely.

delta-x:
  glyph: "Δx"
  tex: "\\Delta x"
  kind: differential
  name: Slice width
  say: "“delta ex”"
  def: "The width of one slice while it is still finite: (b − a)/n."
  eg: "Δx is what dx is before the limit is taken. Same quantity, different stage."

d-theta:
  glyph: "dθ"
  tex: "d\\theta"
  kind: differential
  name: Angle element
  say: "“dee theta”"
  def: The infinitesimal wedge of angle swept by one polar slice.
  eg: "Paired with ½r², because the slice is a circular sector and not a rectangle."

u-fn:
  glyph: "u"
  kind: function
  name: u — the part you differentiate
  say: "“you”"
  def: >-
    A function of x that you choose. Not a variable standing for a number — u is
    a whole piece of the integrand, picked because differentiating it makes
    things simpler.
  eg: >-
    Choosing u is the entire skill in integration by parts. Everything else is
    mechanical.

v-fn:
  glyph: "v"
  kind: function
  name: v — the part you antidifferentiate
  say: "“vee”"
  def: >-
    The other function of x, obtained by antidifferentiating dv. You have to be
    able to find it, which is the hard constraint on how you split the integrand.
  eg: >-
    Any antiderivative works — the constant cancels out of the final answer, so
    take the simplest one.

du:
  glyph: "du"
  kind: differential
  name: The differential of u
  say: "“dee you”"
  def: >-
    u′(x)·dx — what one infinitesimal step in x does to u. Getting it means
    differentiating, which is always doable.
  eg: >-
    That asymmetry is the whole trick: du costs a derivative, v costs an
    integral, so put the awkward factor in u.

dv:
  glyph: "dv"
  kind: differential
  name: The differential of v
  say: "“dee vee”"
  def: >-
    v′(x)·dx — the piece of the integrand you commit to antidifferentiating,
    and it carries the dx.
  eg: >-
    Everything left over after choosing u is dv, including the dx. Leaving the
    dx out is the most common way to get lost.

minus:
  glyph: "−"
  tex: "-"
  kind: operator
  name: Minus sign
  say: "“minus”"
  def: >-
    Subtraction. Between two terms it takes the second away from the first.
  eg: >-
    Here it is not optional bookkeeping — the sign is what makes the identity
    invert the product rule rather than restate it.

g-fn:
  glyph: "g"
  kind: function
  name: g — the inner function
  say: "“gee of ex”"
  def: >-
    The function on the inside of a composite. In substitution it is the thing
    you rename u, and its derivative has to already be present in the integrand.
  eg: >-
    Spotting g is the whole skill: exponent, radicand, or the argument of a log
    or trig function — those are where an inner function hides.

sin-fn:
  glyph: "sin"
  tex: "\\sin"
  kind: function
  name: Sine
  say: "“sine of”"
  def: >-
    A function of an angle. What matters for integration is its derivative:
    (sin x)′ = cos x, so a spare cos x can serve as du.
  eg: >-
    Every trigonometric integral technique is organised around which factor can
    be peeled off to play du.

cos-fn:
  glyph: "cos"
  tex: "\\cos"
  kind: function
  name: Cosine
  say: "“cosine of”"
  def: >-
    The other half of the pair. (cos x)′ = −sin x, so a spare sin x is a du up
    to a sign.
  eg: >-
    Which of sine and cosine you peel is decided by which one has the odd power.

m-exp:
  glyph: "m"
  kind: variable
  name: The sine exponent
  say: "“em”"
  def: >-
    How many sine factors there are. You never evaluate m — you only check
    whether it is odd or even, because that decides the method.
  eg: >-
    Parity, not size, is the question. m = 3 and m = 4 are handled by unrelated
    methods.

k-exp:
  glyph: "k"
  kind: variable
  name: The paired-cosine exponent
  say: "“kay”"
  def: >-
    How many *pairs* of cosines remain after one has been peeled off to be du.
    Pairs are what an identity can convert; a lone factor is not.
  eg: >-
    Writing the cosine power as 2k+1 is what makes the odd case visibly work —
    one factor leaves, and an even number stays behind to be converted.

a-param:
  glyph: "a"
  kind: constant
  name: The constant in the radicand
  say: "“ay”"
  def: >-
    A fixed number, not a limit of integration. It sets the scale of the
    substitution and survives into the answer.
  eg: >-
    a is whatever makes the radicand match one of the three forms — for
    √(4−x²) it is 2, because 4 = 2².

a-root:
  glyph: "a"
  kind: constant
  name: A root of the denominator
  say: "“ay”"
  def: >-
    A value that makes one factor vanish. The decomposition has exactly one term
    per root, which is why factoring completely comes first.
  eg: >-
    Substituting a root back in kills every term but its own — that is the fast
    way to solve for the constants, and it only works for distinct linear roots.

b-root:
  glyph: "b"
  kind: constant
  name: The other root
  say: "“bee”"
  def: >-
    The other value that makes the denominator vanish. Each root of the
    denominator contributes its own term to the decomposition.
  eg: >-
    Repeated roots are the exception: a factor appearing k times needs every
    power from 1 up to k, not one term.

implies:
  glyph: "⇒"
  tex: "\\Rightarrow"
  alt: ["\\Longrightarrow"]
  match: ["⇒", "⟹"]
  kind: operator
  name: Implies
  say: "“therefore”, “which gives”"
  def: >-
    The thing on the left forces the thing on the right. It is one-directional —
    it does not claim the reverse.
  eg: >-
    In a substitution it marks a choice being cashed in: once you pick the
    substitution, the simplification follows with no further decisions.

plus:
  glyph: "+"
  kind: operator
  name: Plus sign
  say: "“plus”"
  def: >-
    Addition. Between two terms it combines them.
  eg: >-
    Under a square root it does not distribute — √(a+b) is not √a + √b, which is
    the error that makes arc-length integrals look easier than they are.

one-const:
  glyph: "1"
  kind: constant
  name: One
  say: "“one”"
  def: >-
    The multiplicative identity. In an integrand it is usually the trace of
    something that cancelled, or a term deliberately added to complete a square.
  eg: >-
    The 1 under the arc-length root is the horizontal run — it is why arc length
    can never come out shorter than the interval.

frac-bar:
  glyph: "⁄"
  tex: "\\frac"
  alt: ["\\tfrac", "\\dfrac"]
  sel: ".mfrac"
  kind: operator
  name: Fraction bar
  say: "“over”"
  def: >-
    Division. Everything above is divided by everything below — the bar also
    groups, which invisible parentheses in a typed formula would not.
  eg: >-
    A fraction whose denominator can vanish is where every convergence and
    improper-integral question in this course comes from.

P-fn:
  glyph: "P"
  kind: function
  name: The numerator polynomial
  say: "“pee of ex”"
  def: >-
    The top of the rational function. Its degree must be strictly less than the
    denominator's before you can decompose.
  eg: >-
    If it isn't, long-divide first. Skipping that step produces a linear system
    with no solution — a confusing way to find out.

A-coef:
  glyph: "A"
  kind: constant
  name: An undetermined constant
  say: "“ay”"
  def: >-
    A number you do not know yet. You write the decomposition with unknown
    numerators, then solve for them.
  eg: >-
    Substituting each root in turn kills every term but one, which is far
    faster than expanding and matching coefficients.

B-coef:
  glyph: "B"
  kind: constant
  name: The other undetermined constant
  say: "“bee”"
  def: >-
    One unknown per factor of the denominator. The count is forced — you need
    exactly as many as the numerator's degree allows.
  eg: >-
    An irreducible quadratic factor gets a *linear* numerator, Ax+B, not a
    single constant. One degree of freedom would not be enough.

t-var:
  glyph: "t"
  kind: variable
  name: t — the moving endpoint or the parameter
  say: "“tee”"
  def: >-
    A variable standing in for something you are about to take to a limit, or
    the parameter tracing a curve. Either way it is the thing that moves.
  eg: >-
    In an improper integral t is what makes the integral proper again: you
    integrate to t honestly, then ask what happens as t runs away.

A-area:
  glyph: "A"
  kind: variable
  name: Area
  say: "“ay”"
  def: >-
    The quantity being accumulated. It comes out positive because the integrand
    was arranged to be non-negative, not because areas are.
  eg: >-
    A bare ∫f gives *signed* area. The sign bookkeeping does not disappear — you
    did it in advance by deciding which curve is on top.

V-vol:
  glyph: "V"
  kind: variable
  name: Volume
  say: "“vee”"
  def: >-
    The accumulated total. As always it is one slice's worth, added up.
  eg: >-
    Which slice you choose is the only real decision; the integral is the same
    machine either way.

pi-const:
  glyph: "π"
  tex: "\\pi"
  kind: constant
  name: Pi
  say: "“pie”"
  def: >-
    The circle constant. Its presence here is the fingerprint of a circular
    cross-section — it enters through the area of the disk, πR².
  eg: >-
    In the shell formula it arrives as 2πr instead, the *circumference* of the
    unrolled sheet. Same constant, different geometry.

R-outer:
  glyph: "R"
  match: ["R", "ro"]
  kind: function
  name: Outer radius
  say: "“big are of ex”"
  def: >-
    The distance from the axis of revolution out to the far edge of the slice.
    A distance to the axis — not the value of f, unless the axis happens to be
    the x-axis.
  eg: >-
    Revolving about y = 2 makes R equal |f(x) − 2|. Getting the axis into the
    radius explicitly is what stops memorised formulas from failing.

r-inner:
  glyph: "r"
  match: ["ri", "r"]
  kind: function
  name: Inner radius
  say: "“little are of ex”"
  def: >-
    The distance from the axis to the near edge — the hole. Zero when the region
    touches the axis, which is when a washer becomes a disk.
  eg: >-
    You subtract the *areas*, not the radii. π(R−r)² describes no region at all
    and is the standard error in this topic.

W-work:
  glyph: "W"
  kind: variable
  name: Work
  say: "“double-you”"
  def: >-
    Force times distance, accumulated. Constant force makes it a multiplication;
    varying force is what forces an integral.
  eg: >-
    In a pumping problem every slab weighs the same but travels a different
    distance — that asymmetry is exactly why it cannot be a multiplication.

F-force:
  glyph: "F"
  kind: function
  name: Force as a function of position
  say: "“eff of ex”"
  def: >-
    How hard you must push when you are at x. If this were constant you would
    not need calculus.
  eg: >-
    Hooke's law F = kx is the archetype. Problems rarely hand you k — you back
    it out of a sentence like "10 N stretches it 0.2 m".

L-len:
  glyph: "L"
  kind: variable
  name: Arc length
  say: "“ell”"
  def: >-
    Distance along the curve, as opposed to the straight-line distance between
    its ends.
  eg: >-
    Read as ∫ speed dt it is total distance travelled — which is why tracing a
    circle twice gives 4π, not 2π.

x-of-t:
  glyph: "x"
  tex: "x"
  kind: function
  name: x as a function of t
  say: "“ex of tee”"
  def: >-
    The horizontal coordinate, given as a function of the parameter rather than
    as the independent variable. This is what frees the curve from the vertical
    line test.
  eg: >-
    Its derivative is the horizontal component of velocity. Where it vanishes
    and y′ does not, the tangent is vertical.

y-of-t:
  glyph: "y"
  tex: "y"
  kind: function
  name: y as a function of t
  say: "“why of tee”"
  def: >-
    The vertical coordinate, also driven by the parameter. The pair (x(t), y(t))
    is a position, and t records when the particle is there.
  eg: >-
    Eliminating t recovers the shape but throws away direction, speed, and how
    many times the curve is traced.

dt:
  glyph: "dt"
  kind: differential
  name: The time differential
  say: "“dee tee”"
  def: >-
    One infinitesimal step of the parameter. Whatever multiplies it is a rate,
    and integrating turns that rate into a total.
  eg: >-
    Speed × dt is distance. That reading is what makes the parametric arc-length
    formula obvious instead of memorised.

a-term:
  glyph: "aₙ"
  tex: "a_n"
  match: "an"
  where: [Sequences and Series]
  kind: variable
  name: The nth term
  say: "“ay sub en”"
  def: >-
    One entry of the sequence — a single number, picked out by its index. Not
    the sum, and not the sequence.
  eg: >-
    aₙ → 0 is necessary for a series to converge and nowhere near sufficient.
    The harmonic series is the standing counterexample.

b-term:
  glyph: "bₙ"
  tex: "b"
  match: ["bn", "bN"]
  where: [Sequences and Series]
  kind: variable
  name: The comparison term
  say: "“bee sub en”"
  def: >-
    A second sequence, chosen because you already know whether its series
    converges. It is the yardstick, not the thing being measured.
  eg: >-
    Pick it by keeping only the dominant power in numerator and denominator —
    that is what makes the ratio tend to something finite and non-zero.

S-partial:
  glyph: "S_N"
  tex: "S_N"
  match: "SN"
  where: [Sequences and Series]
  kind: variable
  name: The Nth partial sum
  say: "“ess sub en”"
  def: >-
    The sum of the first N terms — an ordinary finite sum, with nothing
    infinite about it.
  eg: >-
    This is the object that makes infinite sums definable at all: you never add
    infinitely many things, you watch a sequence of finite sums.

S-sum:
  glyph: "S"
  tex: "S"
  where: [Sequences and Series]
  kind: variable
  name: The sum of the series
  say: "“ess”"
  def: >-
    The limit the partial sums approach, when they approach anything. It is a
    limit, not an addition.
  eg: >-
    Knowing a series converges almost never tells you S. Geometric and
    telescoping series are the rare cases where you can name it.

L-limit:
  glyph: "L"
  kind: variable
  name: The limiting value
  say: "“ell”"
  def: >-
    What the sequence settles down to. In a convergence test it is not an
    answer, only a verdict — its size decides the outcome.
  eg: >-
    L = 1 in the ratio test is genuinely inconclusive, not a near miss: both
    ∑1/n and ∑1/n² give exactly 1.

N-index:
  glyph: "N"
  kind: variable
  name: The cut-off index
  say: "“en”"
  def: >-
    How far along you have gone. Capitalised to distinguish it from the running
    index n, which is summed over and disappears.
  eg: >-
    n is bound and internal; N is a number you choose. Conflating them is why
    partial-sum arguments stop making sense.

c-coef:
  glyph: "cₙ"
  tex: "c_n"
  match: "cn"
  kind: constant
  name: The nth coefficient
  say: "“see sub en”"
  def: >-
    A fixed number multiplying the nth power. The coefficients are the series;
    x is the input it gets evaluated at.
  eg: >-
    A power series is a function whose *coefficients* are the data — which is
    why differentiating one is just a rule on the coefficients.

a-center:
  glyph: "a"
  kind: constant
  name: The centre
  say: "“ay”"
  def: >-
    The point the series is expanded around, and the point where convergence is
    guaranteed no matter what.
  eg: >-
    Every question about a power series is really about distance from a. At
    x = a the series is just c₀ and cannot fail.

R-radius:
  glyph: "R"
  kind: constant
  name: Radius of convergence
  say: "“are”"
  def: >-
    Half the width of the set where the series converges. Inside it, absolutely;
    outside it, not at all.
  eg: >-
    R says nothing about the two endpoints — those converge or not
    independently, and must be tested one at a time by hand.

p-exp:
  glyph: "p"
  kind: variable
  name: The p-exponent
  say: "“pee”"
  def: >-
    The power that decides convergence, and the only thing about the series that
    matters for the verdict.
  eg: >-
    p > 1 converges out at infinity, p < 1 converges near zero. The two point
    opposite ways because fast decay is good far out and violent blow-up is bad
    up close.

less-than:
  glyph: "<"
  kind: operator
  name: Less than
  say: "“is less than”"
  def: >-
    A strict inequality. The two sides are not allowed to be equal.
  eg: >-
    Strictness is the whole content at a boundary case: |x−a| < R says nothing
    at all about what happens when |x−a| = R.

le:
  glyph: "≤"
  tex: "\\le"
  kind: operator
  name: Less than or equal
  say: "“is at most”"
  def: >-
    A bound that the left side is allowed to attain.
  eg: >-
    In an error bound this is a guarantee, not an estimate — the true error is
    somewhere in that range, and you are certain of the worst case.

abs-bars:
  glyph: "| |"
  tex: "|"
  match: ["∣"]
  cls: "!mrel"
  # A bar tall enough to be stretched is drawn as an SVG with no text in it, so
  # it can only be found by selector. KaTeX assembles brackets from sized
  # glyphs and only bars this way, which is what makes the selector safe.
  # A bracket assembled for a matrix is also `.delimsizing.mult`; only the
  # viewBox width tells a stretched bar (333) from a bracket (667).
  sel: '.delimsizing.mult:has(svg[viewBox^="0 0 333"])'
  kind: operator
  name: Absolute value
  say: "“the size of”"
  def: >-
    Distance from zero — magnitude with the sign thrown away.
  eg: >-
    Here it is what makes a test about *size* rather than sign, which is why the
    ratio and root tests prove absolute convergence and get alternating series
    for free.

# ---------- probability ----------

omega-space:
  glyph: "Ω"
  tex: "\\Omega"
  kind: set
  name: The sample space
  say: "“omega”"
  def: >-
    Every outcome the experiment could produce, listed once each and never
    overlapping. Fix this before anything else — probability is attached to
    subsets of it, so getting Ω wrong makes every later number wrong.
  eg: >-
    For two dice, Ω is the 36 ordered pairs, not the 11 possible totals. The
    totals are not equally likely; the pairs are, and that is the whole reason
    to prefer them.

event-A:
  glyph: "A"
  kind: set
  name: An event
  say: "“ay”"
  def: >-
    A subset of the sample space — a collection of outcomes you have decided to
    care about. "The die shows even" is the set {2, 4, 6}.
  eg: >-
    Events are sets, so the language of sets is the language of probability:
    "and" is intersection, "or" is union, "not" is complement.

event-B:
  glyph: "B"
  kind: set
  name: The other event
  say: "“bee”"
  def: >-
    A second subset of the same sample space. Two events can overlap, exclude
    each other, or be unrelated — and those are three genuinely different things.
  eg: >-
    Mutually exclusive is not the same as independent. Disjoint events are about
    as *dependent* as it gets: if one happens, the other definitely did not.

prob-P:
  glyph: "P"
  tex: "P"
  kind: function
  name: The probability measure
  say: "“the probability of”"
  def: >-
    A function that eats a *set* and returns a number in [0, 1]. It is not
    defined on outcomes but on events — which is why P(A) makes sense and
    "the probability of 3" needs the event {3}.
  eg: >-
    Everything follows from three rules: it is never negative, the whole space
    has probability 1, and disjoint pieces add. There is nothing else.

given:
  glyph: "|"
  tex: "\\mid"
  match: "∣"
  cls: mrel
  where: [probability-theory, kalman-filtering]
  kind: operator
  name: The conditioning bar
  say: "“given”"
  def: >-
    Everything to its right is now assumed true. It does not change the world —
    it changes the sample space you are measuring against.
  eg: >-
    P(A|B) and P(B|A) are different numbers and confusing them is the single
    most consequential error in the subject. "Positive test given ill" is not
    "ill given positive test".

cap:
  glyph: "∩"
  tex: "\\cap"
  kind: operator
  name: Intersection
  say: "“and”"
  def: >-
    The outcomes in both events at once. Every "and" in a probability word
    problem is this symbol.
  eg: >-
    P(A ∩ B) = P(A)P(B) is the *definition* of independence, not a general rule.
    Applying it to dependent events is where most wrong answers come from.

cup:
  glyph: "∪"
  tex: "\\cup"
  alt: ["\\bigcup"]
  match: ["∪", "⋃"]
  kind: operator
  name: Union
  say: "“or”"
  def: >-
    The outcomes in either event, or both. Probability's "or" is inclusive.
  eg: >-
    P(A ∪ B) is not P(A) + P(B) unless the events are disjoint — otherwise the
    overlap gets counted twice and has to be subtracted back off.

card-bars:
  glyph: "| |"
  tex: "|"
  match: "∣"
  cls: "!mrel"
  # A bracket assembled for a matrix is also `.delimsizing.mult`; only the
  # viewBox width tells a stretched bar (333) from a bracket (667).
  sel: '.delimsizing.mult:has(svg[viewBox^="0 0 333"])'
  where: [Probability Foundations]
  kind: operator
  name: How many are in it
  say: "“the size of”"
  def: >-
    The number of outcomes in a set. Only useful when outcomes are equally
    likely, which is a modelling assumption rather than a fact.
  eg: >-
    Counting only works if you count the right things. The classic failure is
    counting unequally likely outcomes as if they were equally likely.

rv-X:
  glyph: "X"
  kind: function
  name: A random variable
  say: "“ex”"
  def: >-
    Not a variable at all — a *function* from outcomes to numbers. It attaches a
    number to each thing that could happen, so you can average it.
  eg: >-
    That definition is the point of the whole apparatus. Once outcomes have
    numbers you can add them, and adding is what makes limit theorems possible.

rv-Y:
  glyph: "Y"
  kind: function
  name: A second random variable
  say: "“why”"
  def: >-
    Another function on the *same* sample space — which is what lets you ask
    how the two move together.
  eg: >-
    Two random variables defined on different experiments have no joint
    distribution, and asking about their correlation is meaningless.

expect-E:
  glyph: "E"
  tex: "E"
  kind: operator
  name: Expectation
  say: "“the expected value of”"
  def: >-
    The long-run average value, weighted by probability. An operator on random
    variables, not a number you plug into.
  eg: >-
    It is linear even when the variables are dependent — E[X+Y] = E[X]+E[Y]
    always. That is unreasonably useful and has no analogue for variance.

var-op:
  glyph: "Var"
  tex: "Var"
  kind: operator
  name: Variance
  say: "“the variance of”"
  def: >-
    The expected squared distance from the mean. Squared, so it does not cancel;
    which also means its units are the square of X's.
  eg: >-
    Var(X+Y) = Var(X)+Var(Y) requires independence. Expectation needs no such
    condition, and forgetting the difference is a standard error.

cov-op:
  glyph: "Cov"
  tex: "Cov"
  kind: operator
  name: Covariance
  say: "“the covariance of”"
  def: >-
    Whether two variables tend to be above their means together. Positive if
    they move together, negative if they oppose, zero if neither.
  eg: >-
    Zero covariance does not mean independent. X and X² on a symmetric range
    have zero covariance and one determines the other completely.

mu-mean:
  glyph: "μ"
  tex: "\\mu"
  kind: constant
  name: The mean
  say: "“mew”"
  def: >-
    The centre of the distribution — the expected value, written as a fixed
    number because it is a property of the distribution, not of a sample.
  eg: >-
    μ is what you are trying to learn; the sample mean is your estimate of it.
    Keeping the two apart is most of what statistics is careful about.

sigma-sd:
  glyph: "σ"
  tex: "\\sigma"
  kind: constant
  name: The standard deviation
  say: "“sigma”"
  def: >-
    The square root of the variance, which puts the spread back into the same
    units as X so it can be compared to the mean.
  eg: >-
    It is the natural ruler for distance from the mean. "Three sigma" means
    something across every distribution; "three units" means nothing.

lambda-rate:
  glyph: "λ"
  tex: "\\lambda"
  kind: constant
  name: The rate
  say: "“lambda”"
  def: >-
    Events per unit of time or space. It is both the mean and the variance of a
    Poisson count, which is a strong and testable claim about real data.
  eg: >-
    If your data's variance far exceeds its mean, it is not Poisson —
    overdispersion is usually clustering the model does not allow for.

binom-coef:
  glyph: "(n k)"
  tex: "\\binom"
  match: ["nk", "kn"]
  kind: constant
  name: The binomial coefficient
  say: "“n choose k”"
  def: >-
    How many ways to pick k things out of n when order does not matter. It is a
    *count*, not a probability.
  eg: >-
    It is exactly what turns "one particular sequence of successes" into "any
    sequence with that many successes" — the reason the binomial formula has
    three factors instead of two.

p-prob:
  glyph: "p"
  where: [probability-theory]
  kind: constant
  name: The success probability
  say: "“pee”"
  def: >-
    The chance of success on one trial, assumed the same every time and
    unaffected by the other trials.
  eg: >-
    Both assumptions fail constantly in practice. Drawing without replacement
    breaks them, which is why that case needs a different distribution.

n-trials:
  glyph: "n"
  kind: constant
  name: The number of trials
  say: "“en”"
  def: >-
    How many times the experiment is repeated. Fixed in advance — that is what
    separates the binomial from waiting-time distributions.
  eg: >-
    If you stop when you *feel like it*, n is not fixed and the binomial does
    not apply. Optional stopping quietly invalidates the model.

k-count:
  glyph: "k"
  kind: variable
  name: The number of successes
  say: "“kay”"
  def: >-
    The value being asked about — how many of the n trials succeeded. This is
    what the random variable equals.
  eg: >-
    k runs from 0 to n, and the probabilities over that whole range must sum to
    1. That is a free correctness check on any answer.

e-const:
  glyph: "e"
  tex: "e"
  kind: constant
  name: Euler's number
  say: "“ee”"
  def: >-
    About 2.718. It appears wherever something compounds continuously, which is
    why it shows up in every waiting-time and limiting-count formula.
  eg: >-
    In the Poisson it is what is left of (1 − λ/n)ⁿ as n runs to infinity —
    the fingerprint of a limit having been taken.

density-f:
  glyph: "f"
  kind: function
  name: The probability density
  say: "“eff of ex”"
  def: >-
    Probability per unit length, not probability. It can exceed 1, and f(x) on
    its own is not the chance of anything.
  eg: >-
    For a continuous variable P(X = x) = 0 for every single x. Only intervals
    carry probability, which is why the density has to be integrated.

cdf-F:
  glyph: "F"
  kind: function
  name: The cumulative distribution function
  say: "“big eff of ex”"
  def: >-
    The probability of landing at or below x. It accumulates the density, so it
    is exactly its integral — same relationship as in the fundamental theorem.
  eg: >-
    Unlike a density it always means a probability, always runs from 0 to 1, and
    exists for discrete and continuous variables alike.

xbar:
  glyph: "X̄"
  tex: "\\bar"
  match: "X"
  kind: variable
  name: The sample mean
  say: "“ex bar”"
  def: >-
    The average of n observations. It is itself random — a different sample
    gives a different value — which is the fact the limit theorems are about.
  eg: >-
    Its mean is μ no matter what n is; what shrinks with n is its spread. That
    distinction is the whole content of the law of large numbers.

sim-dist:
  glyph: "∼"
  tex: "\\sim"
  kind: operator
  name: Is distributed as
  say: "“is distributed as”"
  def: >-
    Names which distribution a random variable follows. Not equality — it says
    how the values are spread, not what any one of them is.
  eg: >-
    X ∼ N(0,1) tells you nothing about the value X takes on any given draw, only
    about the pattern over many.

normal-N:
  glyph: "N"
  tex: "N"
  where: [probability-theory, kalman-filtering]
  kind: function
  name: The normal distribution
  say: "“normal”"
  def: >-
    The bell curve, pinned down entirely by its mean and variance. Two numbers
    determine the whole shape.
  eg: >-
    Its importance is not that data is often normal — it frequently is not — but
    that *averages* are, almost regardless of what they average.

to-arrow:
  glyph: "→"
  tex: "\\to"
  alt: ["\\longrightarrow"]
  match: ["→", "⟶"]
  kind: operator
  name: Converges to
  say: "“tends to”"
  def: >-
    The left side gets and stays arbitrarily close to the right as the index
    grows. A limit, with all the usual caveats about what is approaching what.
  eg: >-
    In probability there are several non-equivalent kinds of convergence hiding
    behind this one arrow, and the limit theorems pick different ones.

ge:
  glyph: "≥"
  tex: "\\ge"
  kind: operator
  name: Greater than or equal
  say: "“is at least”"
  def: >-
    A bound the left side may attain.
  eg: >-
    In a tail bound the direction matters enormously — you are asking how much
    probability sits *out past* a threshold, not at it.

# ---------- marks that appear everywhere ----------
# The entries above were written for the `formula` blocks, which name their
# symbols by hand. Everything below exists because the reader now annotates
# *every* formula on a page against this file: a mark with no entry here is a
# glyph the reader cannot ask about. Run `npm run index` — it reports the marks
# still missing, counted by how often they occur.

greater-than:
  glyph: ">"
  kind: operator
  name: Greater than
  say: "“is more than”"
  def: >-
    A strict inequality: the left side exceeds the right, and equality is
    excluded. Which side is bigger is usually the whole content of a theorem.
  eg: >-
    Convergence proofs live on strict inequalities — "for every ε > 0" would be
    vacuous if ε could be zero.

ne:
  glyph: "≠"
  tex: "\\ne"
  alt: ["\\neq"]
  sel: ".mrel:has(> .mrel .rlap)"
  swallow: true
  kind: operator
  name: Not equal
  say: "“is not”"
  def: >-
    Denies sameness, and nothing more — it does not say which side is larger,
    or by how much.
  eg: >-
    P(A ∩ B) ≠ P(A)P(B) is the definition of dependence: it says the product
    rule fails, without saying which way the events pull.

approx:
  glyph: "≈"
  tex: "\\approx"
  kind: operator
  name: Approximately equal
  say: "“is about”"
  def: >-
    The two sides are close, with the size of the gap left unstated. It is an
    honest symbol only when something else pins the error down.
  eg: >-
    Every ≈ in this library has a companion bound somewhere — a remainder term,
    a radius, a tail estimate. Without one it is a hope, not a statement.

much-less:
  glyph: "≪"
  tex: "\\ll"
  kind: operator
  name: Much less than
  say: "“is much smaller than”"
  def: >-
    Smaller by enough that the difference changes the conclusion — a statement
    about scale, not a precise ordering.
  eg: >-
    Used when a term is about to be dropped. The claim being made is that
    keeping it would not move the answer.

propto:
  glyph: "∝"
  tex: "\\propto"
  kind: operator
  name: Proportional to
  say: "“is proportional to”"
  def: >-
    Equal up to a constant factor that has been deliberately left out, usually
    because it will be recovered later by normalising.
  eg: >-
    The posterior ∝ likelihood × prior: the missing constant is the evidence,
    and you can always get it back by making the total come to 1.

iff:
  glyph: "⟺"
  tex: "\\iff"
  alt: ["\\Longleftrightarrow"]
  kind: operator
  name: If and only if
  say: "“exactly when”"
  def: >-
    Both directions hold, so the two sides are interchangeable. Strictly
    stronger than ⇒, and much harder to earn.
  eg: >-
    Most convergence tests give you one direction only. When a test is an ⟺ it
    can also prove divergence, which is why those are the valuable ones.

cdot:
  glyph: "⋅"
  tex: "\\cdot"
  kind: operator
  name: Multiplication dot
  say: "“times”"
  def: >-
    Ordinary multiplication, written with a dot where juxtaposition would be
    ambiguous — between two named quantities, or after a closing bracket.
  eg: "P(A) · P(B) puts a visible gap between two probabilities that are not one symbol."

times-op:
  glyph: "×"
  tex: "\\times"
  kind: operator
  name: Multiplication sign
  say: "“times”"
  def: >-
    The same product as ·, kept for places where the factors are themselves
    expressions and the eye needs a bigger separator.
  eg: "Also the Cartesian product when it sits between two sets rather than two numbers."

pm:
  glyph: "±"
  tex: "\\pm"
  kind: operator
  name: Plus or minus
  say: "“plus or minus”"
  def: >-
    Two statements written as one — take it once with each sign. In an error
    bar it means a symmetric interval around the value.
  eg: "μ ± 2σ is an interval, not a number, and only means 95% for a normal."

in-member:
  glyph: "∈"
  tex: "\\in"
  kind: operator
  name: Is an element of
  say: "“in”"
  def: >-
    Membership: the thing on the left is one of the things the set on the right
    contains. Notice it relates an element to a set, never a set to a set.
  eg: "ω ∈ A is what \"the event happened\" actually means."

subseteq:
  glyph: "⊆"
  tex: "\\subseteq"
  kind: operator
  name: Is a subset of
  say: "“is contained in”"
  def: >-
    Every element of the left is also in the right. Unlike ∈ this relates two
    sets, and it is what makes probability monotone.
  eg: "A ⊆ B forces P(A) ≤ P(B) — a smaller event cannot be more likely."

setminus:
  glyph: "∖"
  tex: "\\setminus"
  kind: operator
  name: Set difference
  say: "“minus”"
  def: >-
    What is left of the first set once everything in the second is removed.
    Order matters: it is not symmetric.
  eg: "Ω ∖ A is the complement — everything that counts as A not happening."

empty-set:
  glyph: "∅"
  tex: "\\varnothing"
  kind: set
  name: The empty set
  say: "“empty set”"
  def: >-
    The set with nothing in it — the event that cannot occur. There is only
    one, which is why "disjoint" can be written as an equation.
  eg: "A ∩ B = ∅ says the two events cannot both happen, which is what lets their probabilities add."

ellipsis:
  glyph: "⋯"
  tex: "\\cdots"
  alt: ["\\ldots", "\\dots", "\\vdots", "\\ddots"]
  match: ["⋯", "…", "⋮"]
  kind: operator
  name: And so on
  say: "“dot dot dot”"
  def: >-
    A claim that the pattern continues in the obvious way. It is the one mark
    here with no formal content — whatever it hides has to be stated elsewhere.
  eg: >-
    In a series it hides the whole question: a + a + ⋯ is only meaningful once
    the limit of the partial sums is defined.

zero-const:
  glyph: "0"
  kind: constant
  name: Zero
  say: "“zero”"
  def: >-
    The additive identity, and in this library usually a boundary: the value a
    limit approaches, a probability that cannot happen, the point where a
    derivative changes a function's direction.
  eg: >-
    Probability zero is not the same as impossible once the outcomes are
    continuous — every single point has it.

delta-change:
  glyph: "Δ"
  tex: "\\Delta"
  kind: operator
  name: Change in
  say: "“delta”"
  def: >-
    A finite difference: the later value minus the earlier one. It is the thing
    that becomes a differential once you take the limit.
  eg: "Δ is measurable; d is the idealisation you get by shrinking Δ to nothing."

d-deriv:
  glyph: "d"
  where: [Foundations of the Integral, Integration Techniques, Parametric and Polar,
          Sequences and Series, Power and Taylor Series]
  kind: operator
  name: The derivative operator
  say: "“dee”"
  def: >-
    Alone above a fraction bar, d is not a quantity — d/dx is one symbol meaning
    "the rate of change with respect to x of whatever follows".
  eg: >-
    You cannot cancel the d's in dy/dx as if they were factors. That the
    notation makes it look like you can is why the chain rule feels obvious.

dy:
  glyph: "dy"
  kind: differential
  name: An infinitesimal step in y
  say: "“dee why”"
  def: >-
    A vanishing change in the output — the vertical side of the triangle whose
    slope is the derivative.
  eg: "dy = f′(x) dx is the statement that near a point, a curve is its tangent line."

ds:
  glyph: "ds"
  kind: differential
  name: An infinitesimal piece of arc
  say: "“dee ess”"
  def: >-
    A vanishing step measured *along* a curve rather than along an axis, which
    is why it shows up as √(dx² + dy²).
  eg: "Arc length and surface area are both integrals of something against ds."

ln-fn:
  glyph: "ln"
  tex: "\\ln"
  kind: function
  name: Natural logarithm
  say: "“ell en”"
  def: >-
    The inverse of e^x: ln y is the exponent that e must be raised to in order
    to give y. It turns products into sums, which is most of what it is for.
  eg: >-
    It grows without bound but slower than any positive power of x — the reason
    ∑1/n diverges while ∑1/n^1.01 does not.

tan-fn:
  glyph: "tan"
  tex: "\\tan"
  kind: function
  name: Tangent
  say: "“tan”"
  def: >-
    sin over cos — the slope of the ray at angle θ. It blows up wherever cos
    is zero, which is why its integrals need care at ±π/2.
  eg: "In a trig substitution, x = a tan θ is chosen precisely because 1 + tan² = sec²."

sec-fn:
  glyph: "sec"
  tex: "\\sec"
  kind: function
  name: Secant
  say: "“seek”"
  def: >-
    One over cosine. It exists as its own name mostly because its derivative and
    its square appear constantly in integration.
  eg: "sec² is the derivative of tan, which is what makes the tangent substitution close."

csc-fn:
  glyph: "csc"
  tex: "\\csc"
  kind: function
  name: Cosecant
  say: "“co-seek”"
  def: One over sine — the partner of sec, with the roles of sin and cos swapped.
  eg: "Every identity involving sec and tan has a mirror image in csc and cot."

cot-fn:
  glyph: "cot"
  tex: "\\cot"
  kind: function
  name: Cotangent
  say: "“co-tan”"
  def: cos over sin. Zero where tan blows up, and vice versa.
  eg: "Appears when a substitution is done in terms of the complementary angle."

arcsin-fn:
  glyph: "arcsin"
  tex: "\\arcsin"
  kind: function
  name: Inverse sine
  say: "“arc sine”"
  def: >-
    The angle whose sine is the input. Only a function once the output is
    restricted to [−π/2, π/2] — sine is not one-to-one without that.
  eg: "The restriction is why a trig substitution has to check which branch it lands on."

arctan-fn:
  glyph: "arctan"
  tex: "\\arctan"
  kind: function
  name: Inverse tangent
  say: "“arc tan”"
  def: >-
    The angle whose tangent is the input, taken in (−π/2, π/2). Bounded, which
    makes it the natural antiderivative of something that decays.
  eg: "∫dx/(1+x²) = arctan x + C — the bounded answer is why that integral converges."

Phi-cdf:
  glyph: "Φ"
  tex: "\\Phi"
  kind: function
  name: The standard normal CDF
  say: "“big phi”"
  def: >-
    The probability that a standard normal lands at or below z. It has no
    elementary formula, which is why it is tabulated rather than evaluated.
  eg: "Every normal question becomes a Φ question after standardising to Z."

max-op:
  glyph: "max"
  tex: "\\max"
  kind: operator
  name: Maximum
  say: "“the largest”"
  def: >-
    The largest value in a collection, when one exists. On an open interval it
    may not — which is exactly the gap a supremum fills.
  eg: >-
    In an error bound, a max over an interval is what turns an unknown
    derivative into a number you can actually use.

T-taylor:
  glyph: "T"
  kind: function
  name: Taylor polynomial
  say: "“tee sub en”"
  def: >-
    The degree-N truncation of a Taylor series — a polynomial, always finite,
    always defined, whether or not the series it comes from converges.
  eg: "f = T_N + R_N is an identity, not an approximation. All the doubt lives in R_N."

Z-score:
  glyph: "Z"
  kind: variable
  name: A standardised variable
  say: "“zee”"
  def: >-
    What is left after subtracting the mean and dividing by the standard
    deviation: a quantity measured in standard deviations rather than in units.
  eg: "Standardising is what makes one normal table serve every normal distribution."

C-const:
  glyph: "C"
  where: [calculus-2]
  kind: constant
  name: Constant of integration
  say: "“see”"
  def: >-
    The information an indefinite integral cannot recover. Differentiation
    destroys constants, so antidifferentiation can only return a whole family.
  eg: >-
    It vanishes in a definite integral because F(b) − F(a) subtracts it — which
    is why the Fundamental Theorem does not care which antiderivative you pick.

M-bound:
  glyph: "M"
  kind: constant
  name: A bound
  say: "“em”"
  def: >-
    A number chosen to be at least as large as something you cannot compute
    exactly — typically the size of a derivative on an interval.
  eg: "Any valid M gives a valid error bound; a smaller M gives a more useful one."

h-step:
  glyph: "h"
  kind: variable
  name: A small step
  say: "“aitch”"
  def: >-
    A displacement that is about to be sent to zero, or the thickness of one
    slice in a sum that is about to become an integral.
  eg: "The whole of differential calculus is one limit as h → 0."

s-arc:
  glyph: "s"
  kind: variable
  name: Distance along a curve
  say: "“ess”"
  def: >-
    Position measured by how far you have travelled along the curve, not by
    where you are in the plane. Independent of how fast the parameter runs.
  eg: >-
    Two parametrisations of the same curve disagree about t everywhere and
    agree about s — which is why arc length is a property of the curve.

w-width:
  glyph: "w"
  kind: function
  name: Width of a slice
  say: "“double you”"
  def: >-
    How wide the cross-section is at a given height — the factor that turns a
    slice's thickness into its area.
  eg: "In a force-on-a-dam problem, w(y) is where the shape of the dam enters."

I-value:
  glyph: "I"
  kind: variable
  name: The integral being computed
  say: "“eye”"
  def: >-
    A name for the unknown value of an integral, so that it can be treated as
    an algebraic quantity and solved for.
  eg: >-
    The trick behind integrating e^x sin x: integrate by parts twice, land back
    on I, and solve the equation instead of the integral.

epsilon-small:
  glyph: "ε"
  tex: "\\varepsilon"
  kind: constant
  name: An arbitrarily small tolerance
  say: "“epsilon”"
  def: >-
    A positive number the *reader* is allowed to choose, however small. The
    claim is that the statement holds no matter how mean the choice.
  eg: >-
    "For every ε > 0" is what converts a vague "gets close" into something you
    can actually prove or refute.

rho-corr:
  glyph: "ρ"
  tex: "\\rho"
  where: [probability-theory]
  kind: constant
  name: Correlation coefficient
  say: "“row”"
  def: >-
    Covariance divided by both standard deviations, which forces it into
    [−1, 1] and makes it unitless — a measure of *linear* association only.
  eg: "ρ = 0 does not mean independent: y = x² over a symmetric range has ρ = 0."

omega-outcome:
  glyph: "ω"
  tex: "\\omega"
  where: [probability-theory]
  kind: variable
  name: A single outcome
  say: "“little omega”"
  def: >-
    One complete result of the experiment — a point of Ω, not a subset of it.
    Events are sets of these.
  eg: "A random variable is a function of ω: X(ω) turns an outcome into a number."

reals:
  glyph: "ℝ"
  tex: "\\mathbb"
  sel: ".mathbb"
  swallow: true
  kind: set
  name: The real numbers
  say: "“the reals”"
  def: >-
    Every point on the number line, gaps included — the rationals plus all the
    limits they approach. Completeness is the property calculus actually uses.
  eg: >-
    "Defined on all of ℝ" is a strong claim: it rules out the punctures where
    a denominator vanishes, which is where partial fractions live.

set-braces:
  glyph: "{ }"
  tex: "\\{"
  alt: ["\\}"]
  match: ["{", "}"]
  kind: set
  name: Set braces
  say: "“the set of”"
  def: >-
    A set listed by its members. Braces carry no order and no repetition — the
    same list written differently is the same set.
  eg: >-
    {HH, HT, TH, TT} has four members; {H, T} has two. Which one is the sample
    space depends on how many coins you agreed to throw.

z-value:
  glyph: "z"
  kind: constant
  name: A standardised value
  say: "“zee”"
  def: >-
    A particular number of standard deviations from the mean — the point a
    normal probability is evaluated at, once units have been divided out.
  eg: "z = 1.96 is the 97.5th percentile, which is where the 95% interval comes from."

event-C:
  glyph: "C"
  where: [probability-theory]
  kind: set
  name: A third event
  say: "“see”"
  def: >-
    Another subset of Ω. Three events is the smallest case where pairwise
    independence and mutual independence come apart.
  eg: >-
    A, B and C can be independent in every pair and still be determined by each
    other jointly — which is why the definition has to check all subsets.

event-D:
  glyph: "D"
  where: [probability-theory]
  kind: set
  name: A named event
  say: "“dee”"
  def: >-
    A letter chosen to stand for what the event *is* rather than for its place
    in a list — D for defective, R for rain.
  eg: "Naming the event after the thing makes the conditioning direction harder to get backwards."

from-arrow:
  glyph: "←"
  tex: "\\leftarrow"
  kind: operator
  name: Follows from
  say: "“is inherited from”"
  def: >-
    Read right to left: the statement on the left is a consequence of the one
    on the right. It marks a result being imported, not derived here.
  eg: >-
    A sequence limit inherited from a function limit only runs this way. The
    function can settle the sequence; the sequence cannot settle the function.

complement:
  glyph: "ᶜ"
  tex: "^c"
  match: ["c"]
  where: [probability-theory]
  kind: operator
  name: Complement
  say: "“not”"
  def: >-
    Everything in Ω that is not in the event — written as a superscript, which
    is easy to lose when reading quickly.
  eg: >-
    P(A) + P(Aᶜ) = 1 is the most useful line in probability: the hard event is
    often the complement of an easy one.

r-ratio:
  glyph: "r"
  where: [Sequences and Series]
  kind: constant
  name: Common ratio
  say: "“are”"
  def: >-
    The factor each term of a geometric series is multiplied by to get the
    next. Everything about the series' fate is in whether |r| < 1.
  eg: >-
    At |r| < 1 the sum is a/(1−r); at |r| ≥ 1 the terms do not even go to zero.
    There is no borderline case to argue about.

rho-density:
  glyph: "ρ"
  tex: "\\rho"
  where: [Applications of Integration]
  kind: constant
  name: Density
  say: "“row”"
  def: >-
    Mass per unit volume, assumed constant unless the problem says otherwise.
    It is what converts a geometric volume into a weight.
  eg: "ρg is weight per unit volume — the factor that turns a slab's volume into the force on it."

S-surface:
  glyph: "S"
  where: [Applications of Integration, Parametric and Polar]
  kind: variable
  name: Surface area
  say: "“ess”"
  def: >-
    The area swept by a curve revolved about an axis: circumference times arc
    length, accumulated.
  eg: >-
    The 2πr in the integrand is a circumference, and the ds is a slant length —
    using dx instead is the classic way to get this wrong.

d-distance:
  glyph: "d"
  where: [Applications of Integration]
  kind: variable
  name: Distance
  say: "“dee”"
  def: >-
    How far something moves. In a work problem it is the *travel* of one slice,
    which generally depends on where that slice started.
  eg: >-
    W = F·d only when the force is constant and every part moves the same
    distance; the integral exists because usually neither holds.

# ---------- estimation and filtering ----------

hat-est:
  glyph: "x̂"
  tex: "\\hat"
  match: "^"
  kind: operator
  name: The estimate hat
  say: "“hat”"
  def: >-
    A hat means "our best guess at", not "the thing itself". x is where the
    system actually is; x̂ is what the filter believes, and the difference
    between them is the quantity nobody ever gets to observe.
  eg: >-
    Every hatted quantity carries a covariance beside it saying how much to
    trust it. A hat without a covariance is an estimate you cannot use.

transpose:
  glyph: "⊤"
  tex: "\\top"
  alt: ["^T"]
  kind: operator
  name: Transpose
  say: "“transpose”"
  def: >-
    Flip a matrix across its diagonal — row i becomes column i. It turns a
    column vector into a row, and reverses the order of a product.
  eg: >-
    It appears in pairs, as AΣAᵀ, because covariance is a *quadratic* thing.
    A lone transpose in a covariance formula is almost always a typo.

x-state:
  glyph: "x"
  where: [kalman-filtering]
  kind: variable
  name: The state
  say: "“ex”"
  def: >-
    The shortest list of numbers that, together with the model, determines the
    system's future. Position and velocity, not position alone — because
    position alone does not tell you where the thing goes next.
  eg: >-
    Choosing the state is the one modelling decision the filter cannot fix for
    you. Leave a quantity out and the filter will blame its effects on noise.

P-cov:
  glyph: "P"
  where: [kalman-filtering]
  kind: variable
  name: The estimate covariance
  say: "“pee”"
  def: >-
    The filter's own claim about how wrong its estimate is: a symmetric matrix
    whose diagonal holds the variance of each state component and whose
    off-diagonal entries say how their errors move together.
  eg: >-
    P is a belief, not a measurement. A filter with a small P and a large error
    is not doing well — it is lying, and that is the failure to watch for.

F-transition:
  glyph: "F"
  where: [kalman-filtering]
  kind: function
  name: The state transition matrix
  say: "“eff”"
  def: >-
    The physics, written as a matrix: where the state goes in one time step if
    nothing disturbs it. For constant velocity it is the matrix that adds
    v·Δt to position and leaves v alone.
  eg: >-
    Every zero in F is a claim that one state component does not affect
    another. Those claims are the model, and they are what fails first.

H-observation:
  glyph: "H"
  where: [kalman-filtering]
  kind: function
  name: The observation matrix
  say: "“aitch”"
  def: >-
    What the sensor would read if the state were exactly x and the sensor were
    perfect. It maps the state into measurement space, which is usually a
    projection onto fewer dimensions.
  eg: >-
    H is normally not square and never inverted. The filter never asks "which
    state produced this reading" — it asks "what would this state have read".

K-gain:
  glyph: "K"
  where: [kalman-filtering]
  kind: variable
  name: The Kalman gain
  say: "“kay”"
  def: >-
    How much of the surprise to believe. Near zero it ignores the sensor and
    coasts on the model; near one it throws the prediction away and follows the
    measurement.
  eg: >-
    It is recomputed every step from the two covariances, which is the whole
    trick — the filter retunes its own trust as conditions change.

Q-proc-noise:
  glyph: "Q"
  where: [kalman-filtering]
  kind: constant
  name: The process noise covariance
  say: "“cue”"
  def: >-
    How wrong the model F is per step, expressed as covariance added at every
    prediction. It is the filter's budget for everything the physics leaves out.
  eg: >-
    Q is the honesty term. Set it to zero and the filter eventually becomes so
    confident that no measurement can move it — which is how filters diverge.

R-meas-noise:
  glyph: "R"
  where: [kalman-filtering]
  kind: constant
  name: The measurement noise covariance
  say: "“arr”"
  def: >-
    How noisy the sensor is. Unlike Q it is often knowable — from a datasheet,
    or by leaving the sensor still and measuring the variance of its output.
  eg: >-
    R is the easy one to get right, which is why a badly behaved filter is
    usually a Q problem or a model problem wearing an R costume.

z-meas:
  glyph: "z"
  where: [kalman-filtering]
  kind: variable
  name: The measurement
  say: "“zed”"
  def: >-
    What the sensor actually reported. The only thing in the whole filter that
    comes from outside — everything else is a belief or a modelling choice.
  eg: >-
    z lives in measurement space, not state space. Comparing it to x directly
    is a dimension error; it is compared to Hx̂, which is the point of H.

y-innov:
  glyph: "y"
  where: [kalman-filtering]
  kind: variable
  name: The innovation
  say: "“the innovation”"
  def: >-
    The surprise: what the sensor said minus what the filter expected it to
    say. It is the only new information any step contains, which is where the
    name comes from.
  eg: >-
    A healthy filter's innovations look like white noise. If they drift or
    autocorrelate, the model is wrong in a way the covariance is hiding.

S-innov-cov:
  glyph: "S"
  where: [kalman-filtering]
  kind: variable
  name: The innovation covariance
  say: "“ess”"
  def: >-
    How surprised the filter expected to be — the predicted spread of the
    innovation, combining the uncertainty it projected forward with the
    sensor's own noise.
  eg: >-
    Dividing the innovation by S is how you test a filter without knowing the
    truth: the result should behave like a standard normal, and usually doesn't.

I-identity:
  glyph: "I"
  where: [kalman-filtering]
  kind: constant
  name: The identity matrix
  say: "“the identity”"
  def: >-
    Ones down the diagonal, zeros everywhere else. Multiplying by it changes
    nothing, which makes it the matrix version of the number 1.
  eg: >-
    In the covariance update, I − KH is the fraction of the prior uncertainty
    that survives the measurement. K = 0 leaves I, and nothing is learned.

Sigma-cov:
  glyph: "Σ"
  tex: "\\Sigma"
  kind: variable
  name: A covariance matrix
  say: "“sigma”"
  def: >-
    The multi-dimensional replacement for σ². Entry (i,j) is the covariance of
    components i and j, so the diagonal holds variances and the rest holds how
    the components lean on each other.
  eg: >-
    It is symmetric and positive semi-definite, always. Those two properties
    are what let it be drawn as an ellipse, and what break under bad arithmetic.

w-proc-noise:
  glyph: "w"
  where: [kalman-filtering]
  kind: variable
  name: The process noise
  say: "“double-you”"
  def: >-
    The random kick the world gives the system between one step and the next —
    the wind, the bump, the unmodelled acceleration. Its covariance is Q.
  eg: >-
    It is never observed and never computed. Only its covariance enters the
    filter, which is why you tune Q rather than estimate w.

v-meas-noise:
  glyph: "v"
  kind: variable
  name: The measurement noise
  say: "“vee”"
  def: >-
    The error in one sensor reading. Assumed zero-mean, independent from step
    to step, and independent of the process noise — three assumptions that are
    each worth checking.
  eg: >-
    A sensor with a bias violates the zero-mean assumption, and the fix is to
    put the bias in the state and let the filter estimate it.

k-step:
  glyph: "k"
  where: [kalman-filtering]
  kind: variable
  name: The time step
  say: "“kay”"
  def: >-
    Which discrete instant we are at. The filter never sees continuous time —
    it sees a sequence of steps, spaced Δt apart.
  eg: >-
    A subscript of k|k−1 reads "at step k, given everything up to step k−1".
    That bar really is the conditioning bar, and the notation means it.

u-control:
  glyph: "u"
  where: [kalman-filtering]
  kind: variable
  name: The control input
  say: "“you”"
  def: >-
    What you deliberately did to the system — the throttle you opened, the
    voltage you applied. Known exactly, so it shifts the prediction without
    adding any uncertainty.
  eg: >-
    Feeding a known input through B is free accuracy. Leaving it out forces Q
    to absorb it, and Q then has to be large enough to cover your own actions.

B-control:
  glyph: "B"
  where: [kalman-filtering]
  kind: function
  name: The control matrix
  say: "“bee”"
  def: >-
    How a control input moves the state in one step. For an acceleration
    command on a position-velocity state it is the column (½Δt², Δt).
  eg: >-
    B and F are the same kind of object — one acts on what you chose, the other
    on where you already were.

A-matrix:
  glyph: "A"
  where: [kalman-filtering]
  kind: function
  name: A matrix
  say: "“ay”"
  def: >-
    A linear map: it takes a vector in and gives a vector out, and it does so
    by scaling and adding, never by bending. That restriction is exactly what
    keeps Gaussians Gaussian.
  eg: >-
    Ax is a *recipe*, not a multiplication of numbers. Reading the columns of A
    as "where each input basis vector lands" makes most matrix identities obvious.

lambda-eigen:
  glyph: "λ"
  tex: "\\lambda"
  where: [kalman-filtering]
  kind: constant
  name: An eigenvalue
  say: "“lambda”"
  def: >-
    A stretch factor along a direction the matrix does not rotate. For a
    covariance matrix the eigenvalues are the variances along its principal
    axes, and their square roots are the ellipse's semi-axis lengths.
  eg: >-
    A covariance with a near-zero eigenvalue is nearly singular — the filter is
    claiming it knows one combination of states exactly, which it rarely does.

trace-op:
  glyph: "tr"
  tex: "tr"
  kind: operator
  name: Trace
  say: "“the trace of”"
  def: >-
    The sum of the diagonal entries. For a covariance matrix that is the total
    variance across all state components — one number for "how uncertain".
  eg: >-
    The gain that minimises the trace of P is the Kalman gain. That is one of
    the two routes to it, and it needs no Gaussian assumption at all.

det-op:
  glyph: "det"
  tex: "\\det"
  kind: operator
  name: Determinant
  say: "“the determinant of”"
  def: >-
    The factor by which a map scales volume. For a covariance matrix it
    measures the volume of the uncertainty ellipsoid — how much room the
    estimate leaves for the truth.
  eg: >-
    It appears under a square root in the Gaussian density because that is what
    normalises the bump to integrate to 1 in n dimensions.

partial-d:
  glyph: "∂"
  tex: "\\partial"
  kind: differential
  name: Partial derivative
  say: "“partial”"
  def: >-
    The rate of change with respect to one variable while the others are held
    fixed. Stacked into a grid it becomes a Jacobian — the best linear
    approximation of a nonlinear map at a point.
  eg: >-
    The extended Kalman filter is entirely this symbol: replace F and H by
    Jacobians evaluated at the current estimate and run the linear filter anyway.

h-meas-fn:
  glyph: "h"
  where: [kalman-filtering]
  kind: function
  name: A nonlinear measurement model
  say: "“aitch”"
  def: >-
    What the sensor reads as a function of the state, when that function is not
    a matrix — a range is a square root, a bearing is an arctangent.
  eg: >-
    Predict with h itself, not with its Jacobian. Using the linearisation to
    predict the measurement throws away accuracy for nothing.

chi-sq:
  glyph: "χ²"
  tex: "\\chi"
  kind: variable
  name: Chi-squared
  say: "“kai squared”"
  def: >-
    The distribution of a sum of squared standard normals. Its mean equals the
    number of terms, which is what makes it a ready-made test statistic.
  eg: >-
    A consistent filter's normalised innovation squared is χ² with as many
    degrees of freedom as the measurement has components. Averaging far above
    that means the filter is over-confident.

rank-op:
  glyph: "rank"
  tex: "rank"
  kind: operator
  name: Rank
  say: "“the rank of”"
  def: >-
    How many independent directions a matrix actually reaches. A stack of rows
    can be tall and still have low rank, which means the extra rows repeat
    information the earlier ones already carried.
  eg: >-
    Full rank in the observability test means every state component eventually
    leaves a trace in the measurements. Anything short of it names a
    combination of states the filter can never learn.

j-index:
  glyph: "j"
  kind: variable
  name: The second counter
  say: "“jay”"
  def: >-
    A second index, brought in when one is not enough. In a covariance matrix
    the pair (i, j) names a cell: how component i and component j vary together.
  eg: >-
    The diagonal is where i equals j, which is why the diagonal of a covariance
    matrix holds ordinary variances rather than anything new.

gamma-gate:
  glyph: "γ"
  tex: "\\gamma"
  where: [kalman-filtering]
  kind: constant
  name: The gate threshold
  say: "“gamma”"
  def: >-
    The largest normalised surprise a filter will still accept. A measurement
    whose innovation exceeds it is treated as an outlier and discarded rather
    than applied.
  eg: >-
    Read it off the chi-squared distribution — about 9 for a scalar measurement
    if you want a three-sigma gate. Too tight and a diverged filter rejects
    every reading that could rescue it.

tau-time:
  glyph: "τ"
  tex: "\\tau"
  where: [kalman-filtering]
  kind: constant
  name: The filter time constant
  say: "“tau”"
  def: >-
    How long the filter's memory is — roughly how many seconds of past
    measurements still influence the current estimate. It is set entirely by
    the ratio of process noise to measurement noise.
  eg: >-
    A long τ smooths well and lags badly. The steady-state lag behind a constant
    acceleration grows as τ², so doubling the smoothing quadruples the bias.

much-greater:
  glyph: "≫"
  tex: "\\gg"
  kind: operator
  name: Much greater than
  say: "“is much bigger than”"
  def: >-
    Bigger by enough that the smaller side stops mattering — a claim about
    scale rather than a precise ordering.
  eg: >-
    In a gain, P ≫ R means the prediction is so much vaguer than the sensor
    that the filter may as well follow the measurement outright.

sigma-pos:
  glyph: "σₚ"
  tex: "\\sigma_p"
  match: "σp"
  where: [kalman-filtering]
  kind: constant
  name: Position uncertainty
  say: "“sigma pee”"
  def: >-
    The standard deviation of the position estimate — the square root of the
    top-left entry of P, and the number a filter usually reports as its accuracy.
  eg: >-
    It is a claim, not a measurement. Comparing it against the actual error is
    the consistency check, and the two part company more often than not.

sigma-vel:
  glyph: "σᵥ"
  tex: "\\sigma_v"
  match: "σv"
  where: [kalman-filtering]
  kind: constant
  name: Velocity uncertainty
  say: "“sigma vee”"
  def: >-
    The standard deviation of the velocity estimate. In a position-only tracker
    nothing measures it directly, so it shrinks entirely through the
    correlation that prediction creates.
  eg: >-
    Coasting converts it into position uncertainty at a rate of Δt per step,
    which is why dead reckoning degrades faster the longer it runs.

sigma-acc:
  glyph: "σₐ"
  tex: "\\sigma_a"
  match: "σa"
  where: [kalman-filtering]
  kind: constant
  name: Process noise strength
  say: "“sigma ay”"
  def: >-
    How hard the world is allowed to accelerate the system in ways the model
    does not know about. It is the single scalar that scales the whole of Q for
    a constant-velocity model.
  eg: >-
    Pick it by answering a question about the system, not by staring at a plot —
    a pedestrian is about 1 m/s², a car 3, a quadrotor dodging 10.

p-position:
  glyph: "p"
  where: [kalman-filtering]
  kind: variable
  name: Position
  say: "“pee”"
  def: >-
    Where the thing is — the component of the state you usually care about, and
    the only one a simple sensor tends to see.
  eg: >-
    It is rarely the whole state. A filter that estimates position alone cannot
    predict, because position now says nothing about position next.

v-velocity:
  glyph: "v"
  where: [Vectors and Covariance]
  kind: variable
  name: Velocity
  say: "“vee”"
  def: >-
    The rate the position is changing. It earns its place in the state not
    because anyone wants it, but because without it the future stops depending
    on the present alone.
  eg: >-
    Usually unmeasured. It is learned through the correlation with position that
    the prediction step manufactures, and nowhere else.

m-meas-dim:
  glyph: "m"
  where: [kalman-filtering]
  kind: constant
  name: The measurement dimension
  say: "“em”"
  def: >-
    How many numbers one measurement carries. It sets the size of R and S, and
    the degrees of freedom of the consistency test.
  eg: >-
    Almost always far smaller than the state dimension, which is why the only
    matrix a filter inverts is the cheap one.

a-direction:
  glyph: "a"
  where: [Vectors and Covariance]
  kind: variable
  name: An arbitrary direction
  say: "“ay”"
  def: >-
    A list of weights, one per state component, naming a direction to ask about.
    aᵀx is the system measured along it — so much position plus so much velocity.
  eg: >-
    Quantifying over every a is how a statement about one matrix becomes a
    statement about every question you could put to it.

c-scale:
  glyph: "c"
  where: [Filters in Practice]
  kind: constant
  name: A common scale factor
  say: "“see”"
  def: >-
    A single positive number multiplying several quantities at once, used to ask
    what an expression depends on and what it merely reports.
  eg: >-
    Scale Q and R together by c and the gain is unchanged while P scales by c —
    which is the proof that tuning a filter is a one-dimensional problem.
